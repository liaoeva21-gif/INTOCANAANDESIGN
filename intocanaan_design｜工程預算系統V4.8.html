<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>INTOCANAAN DESIGN | 工程預算系統</title>

    <!-- 載入 Google Identity Services SDK -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif; }
        
        /* 列印專用樣式 */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; padding: 0;}
            .print-container { max-width: 100% !important; width: 100% !important; padding: 0 !important; box-shadow: none !important; margin: 0; border: none; }
            .page-break-inside-avoid { page-break-inside: avoid; }
            .print-page-break { page-break-after: always; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 20px;}
            tr { page-break-inside: avoid; }
            th, td { border: 1px solid #e5e7eb; padding: 4px 8px !important; font-size: 12px; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

</head>
<body class="bg-gray-50 text-gray-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 🔴 設定您的 Google API Client ID ---
        const CLIENT_ID = '481052743814-3u3vutlbv3mdhacu1gof1tc48to5s9r8.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        // --- 內建圖示組件 ---
        const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconFolderOpen = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 10v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V10"></path><path d="M22 10l-2.5-5.5A2 2 0 0 0 17.6 3H6.4a2 2 0 0 0-1.9 1.5L2 10"></path><path d="M2 10h20"></path></svg>;
        const IconFileSpreadsheet = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M8 13h2"></path><path d="M8 17h2"></path><path d="M14 13h2"></path><path d="M14 17h2"></path></svg>;
        const IconFileText = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconTrash2 = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const IconLink = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>;
        const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
        const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const IconCloud = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;
        const IconCloudUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>;
        const IconLibrary = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>;
        const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const IconLoader = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;
        const IconArrowUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>;
        const IconArrowDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>;
        const IconZap = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;

        const generateId = () => Math.floor(Math.random() * 10000000).toString();

        const CHINESE_NUMS = [
            "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", 
            "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
            "二十一", "二十二", "二十三", "二十四", "二十五", "二十六", "二十七", "二十八", "二十九", "三十"
        ];

        function App() {
            // --- 狀態管理 ---
            const DEFAULT_CATEGORIES = [
                "假設保護與拆除工程", "鋁窗工程", "泥作工程", "水電工程", "空調工程", 
                "木作天花隔間工程", "木作櫃工程", "鐵工工程", "油漆工程", "地坪工程", 
                "廚具工程", "燈具設備", "衛浴設備", "人造石工程", "玻璃工程", 
                "五金設備", "窗簾工程", "其他工程", "清潔工程"
            ];
            const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
            const [projectInfo, setProjectInfo] = useState({
                projectId: "", projectName: "", budgetTitle: "", date: new Date().toISOString().split('T')[0]
            });
            const [targetBudgets, setTargetBudgets] = useState({});
            const [managementFeeRate, setManagementFeeRate] = useState(10);
            const [includeTax, setIncludeTax] = useState(true);
            const [designFee, setDesignFee] = useState(0);

            const [items, setItems] = useState([
                { id: generateId(), sheetName: "假設保護與拆除工程", status: "○○", name: "公共區域保護", category: "保護工程", provider: "振興工程行", internalNote: "", note: "公共區域梯間地坪防護", quantity: 1, unit: "式", unitCost: 6000, unitPrice: 7500 },
                { id: generateId(), sheetName: "假設保護與拆除工程", status: "○○", name: "室內木作拆除", category: "拆除工程", provider: "振興工程行", internalNote: "", note: "全室天花與櫃體", quantity: 1, unit: "式", unitCost: 15000, unitPrice: 20000 },
                { id: generateId(), sheetName: "水電工程", status: "○○", name: "開關箱更新打槽固定及配線整理", category: "插座開關電力工程", provider: "樂川工程有限公司", internalNote: "", note: "", quantity: 1, unit: "式", unitCost: 28000, unitPrice: 35000 },
            ]);
            
            const [activeSheet, setActiveSheet] = useState(categories[0]);
            
            const fileInputRef = useRef(null);
            const csvInputRef = useRef(null);
            const txtInputRef = useRef(null); // 🌟 新增 TXT 檔案匯入的 Reference

            // Google Drive 狀態
            const [tokenClient, setTokenClient] = useState(null);
            const [googleAccessToken, setGoogleAccessToken] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [cloudFiles, setCloudFiles] = useState([]);
            const [isFetchingFiles, setIsFetchingFiles] = useState(false);

            // 🌟 廠商報價匯入狀態
            const [isVendorModalOpen, setIsVendorModalOpen] = useState(false);
            const [vendorNameInput, setVendorNameInput] = useState("");
            const [vendorTextInput, setVendorTextInput] = useState("");

            // 🌟 數量計算表連動狀態
            const [isQuantityModalOpen, setIsQuantityModalOpen] = useState(false);
            const [quantityTextInput, setQuantityTextInput] = useState("");

            const [printMode, setPrintMode] = useState('quote'); // 'quote' or 'internal'

            useEffect(() => {
                let isMounted = true;
                const initGIS = () => {
                    if (window.google && window.google.accounts && isMounted) {
                        const client = window.google.accounts.oauth2.initTokenClient({
                            client_id: CLIENT_ID,
                            scope: SCOPES,
                            callback: (tokenResponse) => {
                                if (tokenResponse && tokenResponse.access_token) {
                                    setGoogleAccessToken(tokenResponse.access_token);
                                }
                            },
                            error_callback: (err) => {
                                console.error("GIS Error:", err);
                                alert('Google 授權失敗，請確認 Client ID 或網域設定。');
                            }
                        });
                        setTokenClient(client);
                    }
                };
                
                if (window.google && window.google.accounts) {
                    initGIS();
                } else {
                    const googleScript = document.getElementById('google-gsi-client');
                    if (googleScript) {
                        googleScript.addEventListener('load', initGIS);
                    }
                }
                return () => { isMounted = false; };
            }, []);

            const handleGoogleAuth = () => {
                if (CLIENT_ID.includes('您的_CLIENT_ID')) {
                    alert("請先在程式碼中填寫您的 Google API Client ID！");
                    return;
                }
                if (!tokenClient) return alert('Google SDK 尚未載入完成，請稍候再試。');
                tokenClient.requestAccessToken();
            };

            const handleSaveToDrive = async () => {
                if (!googleAccessToken) {
                    handleGoogleAuth();
                    return;
                }

                const projName = projectInfo.projectName.trim();
                if (!projName) return alert("請先填寫「專案名稱」做為儲存識別檔名！");

                setIsUploading(true);
                const fileName = `${projName}_IntocanaanEngineering.json`;
                const stateData = { projectInfo, categories, items, targetBudgets, managementFeeRate, includeTax, designFee };
                const fileContent = JSON.stringify(stateData, null, 2);

                try {
                    const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${fileName}' and trashed=false`, {
                        headers: { Authorization: `Bearer ${googleAccessToken}` }
                    });
                    const searchData = await searchRes.json();

                    const metadata = { name: fileName, mimeType: 'application/json' };
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', new Blob([fileContent], { type: 'application/json' }));

                    let uploadUrl = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
                    let method = 'POST'; 

                    if (searchData.files && searchData.files.length > 0) {
                        uploadUrl = `https://www.googleapis.com/upload/drive/v3/files/${searchData.files[0].id}?uploadType=multipart`;
                        method = 'PATCH';
                    }

                    const uploadRes = await fetch(uploadUrl, {
                        method: method,
                        headers: { Authorization: `Bearer ${googleAccessToken}` },
                        body: form
                    });

                    if (uploadRes.ok) alert("✅ 成功儲存至 Google 雲端硬碟！");
                    else throw new Error("上傳失敗");
                } catch (error) {
                    console.error("Google Drive API Error:", error);
                    alert("儲存失敗，請確認網路或重新授權。");
                } finally {
                    setIsUploading(false);
                }
            };

            const openCloudModal = async () => {
                setIsModalOpen(true);
                if (googleAccessToken) fetchDriveFiles();
            };

            const fetchDriveFiles = async () => {
                setIsFetchingFiles(true);
                try {
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name contains '_IntocanaanEngineering.json' and trashed=false&fields=files(id, name, modifiedTime)&orderBy=modifiedTime desc`, {
                        headers: { Authorization: `Bearer ${googleAccessToken}` }
                    });
                    const data = await res.json();
                    setCloudFiles(data.files || []);
                } catch (error) {
                    console.error(error);
                    alert("讀取失敗，可能是授權過期。請重新整理頁面。");
                } finally {
                    setIsFetchingFiles(false);
                }
            };

            const loadDriveFile = async (fileId) => {
                try {
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                        headers: { Authorization: `Bearer ${googleAccessToken}` }
                    });
                    const parsed = await res.json();
                    
                    if (parsed.projectInfo) setProjectInfo(parsed.projectInfo);
                    if (parsed.items) setItems(parsed.items);
                    if (parsed.targetBudgets) setTargetBudgets(parsed.targetBudgets);
                    if (parsed.managementFeeRate !== undefined) setManagementFeeRate(parsed.managementFeeRate);
                    if (parsed.includeTax !== undefined) setIncludeTax(parsed.includeTax);
                    if (parsed.designFee !== undefined) setDesignFee(parsed.designFee);
                    
                    let importedCategories = parsed.categories;
                    if (!importedCategories || importedCategories.length === 0) {
                        importedCategories = parsed.items && parsed.items.length > 0 
                            ? [...new Set(parsed.items.map(i => i.sheetName))] 
                            : DEFAULT_CATEGORIES;
                    }
                    setCategories(importedCategories);
                    if (importedCategories.length > 0) setActiveSheet(importedCategories[0]);
                    
                    setIsModalOpen(false);
                    alert("✅ 專案載入成功！");
                } catch (error) {
                    console.error(error);
                    alert("載入檔案失敗，檔案可能已損毀。");
                }
            };

            // --- 計算與邏輯 ---
            const currentSheetItems = useMemo(() => items.filter(item => item.sheetName === activeSheet), [items, activeSheet]);
            
            const { totalCost, netTotalPrice } = useMemo(() => {
                return items.reduce((acc, item) => ({
                    totalCost: acc.totalCost + (item.quantity * item.unitCost),
                    netTotalPrice: acc.netTotalPrice + (item.quantity * item.unitPrice)
                }), { totalCost: 0, netTotalPrice: 0 });
            }, [items]);

            const managementFee = Math.round(netTotalPrice * (managementFeeRate / 100));
            const taxBase = netTotalPrice + managementFee + designFee;
            const tax = includeTax ? Math.round(taxBase * 0.05) : 0;
            const grossTotal = taxBase + tax;
            const profit = netTotalPrice - totalCost;

            const groupedActiveItems = useMemo(() => {
                const map = new Map();
                currentSheetItems.forEach(item => {
                    const cat = item.category || '未分類';
                    if (!map.has(cat)) map.set(cat, []);
                    map.get(cat).push(item);
                });
                return Array.from(map.entries());
            }, [currentSheetItems]);

            const activeSheetTotalPrice = useMemo(() => {
                return currentSheetItems.reduce((acc, i) => acc + (i.quantity * i.unitPrice), 0);
            }, [currentSheetItems]);

            const activeSheetTotalCost = useMemo(() => {
                return currentSheetItems.reduce((acc, i) => acc + (i.quantity * i.unitCost), 0);
            }, [currentSheetItems]);

            // --- 網頁操作 Handler ---
            const handleAddCategory = () => {
                const newCat = window.prompt("請輸入新的分頁名稱 (例如: 弱電工程):");
                if (newCat && newCat.trim() !== "" && !categories.includes(newCat)) {
                    setCategories([...categories, newCat.trim()]);
                    setActiveSheet(newCat.trim());
                }
            };

            const handleDeleteCategory = (catToDelete) => {
                if (categories.length <= 1) return alert("至少需保留一個分頁！");
                const hasItems = items.some(i => i.sheetName === catToDelete);
                if (hasItems && !window.confirm(`「${catToDelete}」中尚有工項，確定要刪除嗎？`)) return;
                
                setCategories(categories.filter(c => c !== catToDelete));
                setItems(items.filter(i => i.sheetName !== catToDelete));
                if (activeSheet === catToDelete) setActiveSheet(categories[0] === catToDelete ? categories[1] : categories[0]);
            };

            const handleAddItem = () => {
                const currentSheetItemsList = items.filter(item => item.sheetName === activeSheet);
                const lastItemCategory = currentSheetItemsList.length > 0 ? currentSheetItemsList[currentSheetItemsList.length - 1].category : "";
                setItems([...items, {
                    id: generateId(), sheetName: activeSheet, status: "○○", 
                    name: "", category: lastItemCategory, provider: "暫時估價", internalNote: "", note: "",
                    quantity: 1, unit: "式", unitCost: 0, unitPrice: 0
                }]);
            };

            const handleItemChange = (id, field, value) => {
                setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
            };

            const handleRemoveItem = (id) => setItems(items.filter(item => item.id !== id));

            const handleMoveItem = (id, direction) => {
                const itemIndexInGlobal = items.findIndex(i => i.id === id);
                if (itemIndexInGlobal < 0) return;

                const sheetItemsList = items.filter(i => i.sheetName === activeSheet);
                const indexInSheet = sheetItemsList.findIndex(i => i.id === id);

                if (direction === 'up' && indexInSheet > 0) {
                    const targetId = sheetItemsList[indexInSheet - 1].id;
                    const targetIndexGlobal = items.findIndex(i => i.id === targetId);
                    const newItems = [...items];
                    [newItems[itemIndexInGlobal], newItems[targetIndexGlobal]] = [newItems[targetIndexGlobal], newItems[itemIndexInGlobal]];
                    setItems(newItems);
                } else if (direction === 'down' && indexInSheet < sheetItemsList.length - 1) {
                    const targetId = sheetItemsList[indexInSheet + 1].id;
                    const targetIndexGlobal = items.findIndex(i => i.id === targetId);
                    const newItems = [...items];
                    [newItems[itemIndexInGlobal], newItems[targetIndexGlobal]] = [newItems[targetIndexGlobal], newItems[itemIndexInGlobal]];
                    setItems(newItems);
                }
            };

            const handleCategoryNameChange = (oldCatName, newCatName) => {
                if (oldCatName === newCatName || newCatName.trim() === '') return;
                setItems(items.map(item => {
                    const currentCat = item.category || '未分類';
                    if (item.sheetName === activeSheet && currentCat === oldCatName) return { ...item, category: newCatName.trim() };
                    return item;
                }));
            };

            const handleMoveCategory = (direction) => {
                const index = categories.indexOf(activeSheet);
                if (index < 0) return;
                const newCats = [...categories];
                if (direction === 'left' && index > 0) {
                    [newCats[index - 1], newCats[index]] = [newCats[index], newCats[index - 1]];
                    setCategories(newCats);
                } else if (direction === 'right' && index < categories.length - 1) {
                    [newCats[index], newCats[index + 1]] = [newCats[index + 1], newCats[index]];
                    setCategories(newCats);
                }
            };

            const handleRenameCategory = (oldName, newName) => {
                const finalName = newName.trim();
                if (!finalName || oldName === finalName) return;
                if (categories.includes(finalName)) return alert('已存在相同名稱的分頁！');
                
                setCategories(categories.map(c => c === oldName ? finalName : c));
                setItems(items.map(item => item.sheetName === oldName ? { ...item, sheetName: finalName } : item));
                if (activeSheet === oldName) setActiveSheet(finalName);
                
                if (targetBudgets[oldName] !== undefined) {
                    setTargetBudgets(prev => {
                        const newTargets = { ...prev, [finalName]: prev[oldName] };
                        delete newTargets[oldName];
                        return newTargets;
                    });
                }
            };

            // 🌟 處理廠商報價智能匯入
            const processVendorImport = () => {
                if (!vendorTextInput.trim()) {
                    alert("請貼上文字內容！");
                    return;
                }

                const lines = vendorTextInput.split('\n').filter(l => l.trim() !== '');
                let parsedItems = [];
                let successCount = 0;
                
                // 常見單位庫 (擴充以提升準確率)
                const commonUnits = ['式', '一式', '坪', '樘', '尺', '公尺', 'm', 'cm', '組', '台', '才', '迴', '處', '口', '趟', '份', '個', '套', '批', '間', '車', '車次', '工', '天', 'm2', '才/尺', '片', '支', '式/月', '月'];

                lines.forEach(line => {
                    // 漸進式分割邏輯
                    let parts = line.split(/\t/).map(p => p.trim()).filter(p => p !== '');
                    if (parts.length <= 1 && line.includes(',')) {
                        parts = line.split(/,/).map(p => p.trim()).filter(p => p !== '');
                    }
                    if (parts.length <= 1) {
                        parts = line.split(/(?:\s{2,}|　+)/).map(p => p.trim()).filter(p => p !== '');
                    }
                    if (parts.length <= 1) {
                        parts = line.split(/\s+/).map(p => p.trim()).filter(p => p !== '');
                    }

                    if (parts.length > 0) {
                        // 清除開頭可能誤判的項次編號 (例如: 1, 1., (1), 01, 1-1)
                        if (parts.length > 1 && /^(\(?\d+[\.\-、\)]?)$/.test(parts[0])) {
                            parts.shift();
                        }

                        // 🌟 嚴格數字判定：排除夾雜中文或英文的備註文字 (如 "含批土2次")，避免誤判為單價/數量
                        const isStrictNum = (str) => {
                            let cleanStr = str.replace(/[,$NTnt]/g, '');
                            return cleanStr !== '' && !isNaN(cleanStr) && /^[\d]+(\.[\d]+)?$/.test(cleanStr);
                        };
                        const getNum = (str) => parseFloat(str.replace(/[,$NTnt]/g, ''));

                        let nums = [];
                        parts.forEach((p, i) => { if (isStrictNum(p)) nums.push(i); });
                        
                        let uIdx = parts.findIndex(p => commonUnits.includes(p));
                        let qIdx = -1;
                        let pIdx = -1;
                        let sIdx = -1; // 用於捕捉 Subtotal (小計/複價)，避免它掉進備註欄

                        if (nums.length === 1) {
                            pIdx = nums[0];
                        } else if (nums.length >= 2) {
                            if (uIdx !== -1) {
                                // 找單位前面的數字當作數量
                                if (nums.includes(uIdx - 1)) qIdx = uIdx - 1;
                                // 找單位後面的第一個數字當作單價
                                let afterUnit = nums.find(n => n > uIdx);
                                if (afterUnit) pIdx = afterUnit;
                            } else {
                                // 沒單位時，依序當作數量跟單價
                                qIdx = nums[0];
                                pIdx = nums[1];
                            }
                        }

                        // 補救措施：如果有數字但沒分配到 pIdx，強制指定最後一個數字為單價
                        if (pIdx === -1 && nums.length > 0) {
                            pIdx = nums[nums.length - 1];
                        }
                        if (qIdx === pIdx) qIdx = -1; // 避免數量跟單價重疊

                        // 🌟 捕捉複價/小計 (接在單價後面的下一個純數字)
                        if (pIdx !== -1) {
                            let nextNumIdx = nums.find(n => n > pIdx);
                            if (nextNumIdx === pIdx + 1) {
                                sIdx = nextNumIdx;
                            }
                        }

                        let quantity = qIdx !== -1 ? getNum(parts[qIdx]) : 1;
                        let price = pIdx !== -1 ? getNum(parts[pIdx]) : 0;
                        let unit = uIdx !== -1 ? parts[uIdx] : '式';

                        // 決定擷取名稱與備註的邊界
                        let usedIndices = [qIdx, uIdx, pIdx, sIdx].filter(i => i !== -1);
                        let firstSpecial = usedIndices.length > 0 ? Math.min(...usedIndices) : parts.length;
                        let lastSpecial = usedIndices.length > 0 ? Math.max(...usedIndices) : -1;

                        let name = parts.slice(0, firstSpecial).join(' ') || '未命名';
                        
                        // 🌟 備註只取最後一個識別物之後的所有內容 (確保複價、總計等數字已被過濾，不會寫入備註)
                        let note = usedIndices.length > 0 ? parts.slice(lastSpecial + 1).join(' ') : '';

                        // 最終防呆：確保單位不要太長
                        if (unit && unit.length > 4) {
                            note = (unit + " " + note).trim();
                            unit = "式";
                        }

                        if (name && name !== '未命名') {
                            parsedItems.push({
                                id: generateId() + Math.floor(Math.random()*1000).toString(),
                                sheetName: activeSheet,
                                status: "○○",
                                name: name,
                                category: activeSheet, 
                                provider: vendorNameInput || "未指定廠商",
                                internalNote: "",
                                note: note,
                                quantity: quantity,
                                unit: unit,
                                unitCost: price,
                                unitPrice: price
                            });
                            successCount++;
                        }
                    }
                });

                if (successCount > 0) {
                    setItems([...items, ...parsedItems]);
                    alert(`✅ 成功智能解析並匯入 ${successCount} 筆工項至「${activeSheet}」！\n系統已將廠商報價自動設定為您的「單位成本」。`);
                    setIsVendorModalOpen(false);
                    setVendorTextInput("");
                } else {
                    alert("無法解析貼上的文字，請確認是否包含有效的欄位與數值。");
                }
            };

            // 🌟 處理 TXT / CSV 檔案快速載入至數量計算文字框
            const handleImportTXT = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    setQuantityTextInput(event.target.result); // 將檔案內容載入 Textarea 中供預覽
                };
                reader.readAsText(file, "UTF-8");
                e.target.value = null; // 重置 input 狀態
            };

            // 🌟 處理數量計算表智能連動
            const processQuantityImport = () => {
                if (!quantityTextInput.trim()) {
                    alert("請貼上文字內容！");
                    return;
                }

                const lines = quantityTextInput.split('\n').filter(l => l.trim() !== '');
                let newItems = [...items];
                let updateCount = 0;
                let qtyMap = {};

                lines.forEach(line => {
                    // 切割邏輯，支援 Excel (Tab) 或是 CSV (逗號)、手打空白
                    let parts = line.split(/\t/).map(p => p.trim()).filter(p => p !== '');
                    if (parts.length <= 1 && line.includes(',')) parts = line.split(/,/).map(p => p.trim()).filter(p => p !== '');
                    if (parts.length <= 1) parts = line.split(/(?:\s{2,}|　+)/).map(p => p.trim()).filter(p => p !== '');
                    if (parts.length <= 1) parts = line.split(/\s+/).map(p => p.trim()).filter(p => p !== '');

                    if (parts.length >= 2) {
                        // 清除開頭可能誤判的項次編號
                        if (/^(\(?\d+[\.\-、\)]?)$/.test(parts[0])) parts.shift();
                        
                        let name = parts[0];
                        let qty = null;
                        
                        // 尋找陣列中的第一個純數字作為數量
                        for (let j = 1; j < parts.length; j++) {
                            let cleanStr = parts[j].replace(/[,$NTnt]/g, '');
                            if (cleanStr !== '' && !isNaN(cleanStr) && /^[\d]+(\.[\d]+)?$/.test(cleanStr)) {
                                qty = parseFloat(cleanStr);
                                break; 
                            }
                        }
                        
                        if (name && qty !== null) {
                            // 去除所有空白以增加配對容錯率 (例如: "油漆工程" 可配對 "油 漆 工 程")
                            qtyMap[name.replace(/\s+/g, '')] = qty;
                        }
                    }
                });

                // 配對並更新現有工項的數量
                newItems = newItems.map(item => {
                    const cleanItemName = item.name.replace(/\s+/g, '');
                    if (cleanItemName && qtyMap[cleanItemName] !== undefined) {
                        updateCount++;
                        return { ...item, quantity: qtyMap[cleanItemName] };
                    }
                    return item;
                });

                if (updateCount > 0) {
                    setItems(newItems);
                    alert(`✅ 成功智能解析數量表！\n\n📊 系統已自動比對名稱，並跨分頁成功更新了 ${updateCount} 筆工項的數量。`);
                    setIsQuantityModalOpen(false);
                    setQuantityTextInput("");
                } else {
                    alert("⚠️ 無法配對任何工項名稱。\n請確保貼上的文字包含「項目名稱」與「數量數字」，且名稱與系統內現有工項的名稱一致。");
                }
            };

            // --- 檔案匯入匯出 ---
            const handleExportJSON = () => {
                const data = JSON.stringify({ projectInfo, categories, items, targetBudgets, managementFeeRate, includeTax, designFee }, null, 2);
                const blob = new Blob(["\uFEFF" + data], { type: "application/json;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${projectInfo.projectName || '未命名專案'}_預算設定.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.projectInfo) setProjectInfo(parsed.projectInfo);
                        if (parsed.items) setItems(parsed.items);
                        if (parsed.targetBudgets) setTargetBudgets(parsed.targetBudgets);
                        if (parsed.managementFeeRate !== undefined) setManagementFeeRate(parsed.managementFeeRate);
                        if (parsed.includeTax !== undefined) setIncludeTax(parsed.includeTax);
                        if (parsed.designFee !== undefined) setDesignFee(parsed.designFee);
                        
                        let importedCategories = parsed.categories;
                        if (!importedCategories || importedCategories.length === 0) {
                            importedCategories = parsed.items && parsed.items.length > 0 ? [...new Set(parsed.items.map(i => i.sheetName))] : DEFAULT_CATEGORIES;
                        }
                        setCategories(importedCategories);
                        if (importedCategories.length > 0) setActiveSheet(importedCategories[0]);
                    } catch (err) { alert("JSON 檔案格式錯誤或編碼非 UTF-8！"); }
                };
                reader.readAsText(file, "UTF-8");
                e.target.value = null;
            };

            const handleImportAllocationCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                const executeParse = (text) => {
                    try {
                        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
                        let newTargets = { ...targetBudgets };
                        let newCats = [...categories];
                        let parsingItems = false;
                        let newProjectName = projectInfo.projectName;
                        let importCount = 0;
                        
                        const parseCSVRow = (row) => {
                            const result = []; let cur = ''; let inQuotes = false;
                            for (let i = 0; i < row.length; i++) {
                                const char = row[i];
                                if (char === '"' && row[i+1] === '"') { cur += '"'; i++; }
                                else if (char === '"') inQuotes = !inQuotes;
                                else if (char === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
                                else cur += char;
                            }
                            result.push(cur.trim()); return result;
                        };
                        
                        for (let i = 0; i < lines.length; i++) {
                            const cols = parseCSVRow(lines[i]);
                            const col0 = cols[0] || '';
                            
                            if (col0.includes('專案名稱') && i + 1 < lines.length) {
                                const dataCols = parseCSVRow(lines[i + 1]);
                                if (dataCols[0] && !dataCols[0].includes('工項名稱')) newProjectName = dataCols[0].replace(/^"|"$/g, '').trim();
                            }
                            
                            if (col0.includes('工項名稱') || col0.includes('工程項目')) { parsingItems = true; continue; }
                            
                            if (parsingItems) {
                                if (col0.includes('未稅') || col0.includes('含稅') || col0.includes('總額') || col0.includes('總預算') || col0.includes('工程監管費')) {
                                    parsingItems = false; continue;
                                }
                                let catName = col0.replace(/^"|"$/g, '').trim();
                                let amountStr = cols.length >= 3 ? cols[2] : "";
                                const amount = parseInt(String(amountStr).replace(/[^0-9]/g, ''), 10);
                                
                                if (catName && !isNaN(amount) && amount > 0) {
                                    newTargets[catName] = amount; importCount++;
                                    if (!newCats.includes(catName)) newCats.push(catName);
                                }
                            }
                        }
                        
                        if (importCount === 0) return alert("⚠️ 檔案解析完成，但未能成功讀取任何目標預算。");
                        
                        setTargetBudgets(newTargets);
                        setCategories(newCats);
                        setProjectInfo(prev => ({ ...prev, projectName: newProjectName }));
                        alert(`✅ 成功連動匯入「預算分配表」！\n\n👉 專案名稱已更新為：${newProjectName}\n📊 共載入 ${importCount} 項目標預算`);
                    } catch (err) { alert("匯入失敗，請確認檔案格式是否正確。"); }
                };

                reader.onload = (event) => {
                    const text = event.target.result;
                    if (text.includes('')) {
                        const readerBig5 = new FileReader();
                        readerBig5.onload = (e2) => executeParse(e2.target.result);
                        readerBig5.readAsText(file, "Big5");
                    } else executeParse(text);
                };
                reader.readAsText(file, "UTF-8");
                e.target.value = null;
            };

            const handleExportExcel = () => {
                if (!window.XLSX) return alert("Excel 引擎載入中，請稍候再試。");
                const wb = window.XLSX.utils.book_new();

                categories.forEach(sheetName => {
                    const sheetItems = items.filter(i => i.sheetName === sheetName);
                    const pad = (arr, length) => { while(arr.length < length) arr.push(null); return arr; };

                    const row1 = pad(["專案編號:", null, null, null, null, { v: projectInfo.projectId, t: 's' }], 33);
                    const row2 = pad(["專案名稱:", null, null, null, null, { v: projectInfo.projectName, t: 's' }], 33);
                    const row3 = pad(["預算單:", null, null, null, null, { v: projectInfo.budgetTitle, t: 's' }], 33);
                    const row4 = pad(["分頁:", null, null, null, null, { v: sheetName, t: 's' }], 33);
                    row4[31] = "日期:"; row4[32] = { v: projectInfo.date.replace(/-/g, '/'), t: 's' };
                    const worksheetId = Math.floor(Math.random() * 90000) + 10000;
                    const row5 = pad(["worksheet ID:", null, null, null, null, { v: worksheetId.toString(), t: 's' }], 33);
                    
                    const row6 = ["delete", null, "id", null, null, "name", "category", "provider", "note_internal1", "note", "budget_quantity", "cost_unit", "price_quantity", "price_unit", "cost", "price", "original_status", "original_name", "original_category", "original_provider", "original_note_internal1", "original_note", "original_budget_quantity", "original_cost_unit", "original_price_quantity", "original_price_unit", "original_cost", "original_price", "timestamp", null, null, null, "num_subitems"];
                    const row7 = ["刪除", "Class", "ID", "新增", "狀態", "項目 *", "分類", "廠商", "內部備註", "報價備註", "成本數量/單位 *", null, "報價數量/單位 *", null, "單位成本 *", "單位報價 *", "狀態", "項目", "分類", "廠商", "內部備註", "報價備註", "報價數量/單位", null, "數量/單位", null, "單位成本", "單位報價", "匯出時間", "成本", "報價", "預估毛利率", "子項目數量"];

                    const aoa = [row1, row2, row3, row4, row5, row6, row7];

                    sheetItems.forEach(item => {
                        const now = new Date().toISOString();
                        const costAmount = (item.quantity || 0) * (item.unitCost || 0);
                        const priceAmount = (item.quantity || 0) * (item.unitPrice || 0);
                        const margin = priceAmount > 0 ? (((priceAmount - costAmount) / priceAmount) * 100).toFixed(1) + "%" : "0.0%";

                        aoa.push([
                            null, "WorkItem", { v: item.id || "", t: 's' }, null, item.status || "○○", item.name || null, item.category || null, item.provider || null, item.internalNote || null, item.note || null,
                            item.quantity || 0, item.unit || "式", item.quantity || 0, item.unit || "式", item.unitCost || 0, item.unitPrice || 0,
                            "wis_preparing", item.name || null, item.category || null, item.provider || null, item.internalNote || null, item.note || null,
                            item.quantity || 0, item.unit || "式", item.quantity || 0, item.unit || "式", item.unitCost || 0, item.unitPrice || 0,
                            now, costAmount, priceAmount, margin, 0
                        ]);
                    });

                    for (let i = 0; i < 4; i++) {
                        aoa.push([
                            null, "WorkItem", null, "v", "○○", "（新增工項於此）", null, null, null, null, 1, "式", 1, "式", 0, 0,
                            null, null, null, null, null, null, null, null, null, null, null, null, new Date().toISOString(), null, null, null, 0
                        ]);
                    }

                    const ws = window.XLSX.utils.aoa_to_sheet(aoa);
                    window.XLSX.utils.book_append_sheet(wb, ws, sheetName.substring(0, 31));
                });
                window.XLSX.writeFile(wb, `${projectInfo.projectName || '未命名專案'}_工程報價單.xlsx`);
            };

            const formatCurrency = (num) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(num);

            return (
                <div className="min-h-screen px-4 py-6 md:px-12 lg:px-24 xl:px-32 print-container w-full mx-auto relative">
                    
                    {/* 🌟 廠商報價智能匯入 Modal */}
                    {isVendorModalOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity no-print">
                            <div className="bg-white p-8 max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl rounded-xl border border-gray-200">
                                <div className="flex justify-between items-center mb-4 border-b pb-4">
                                    <div>
                                        <h2 className="text-xl font-bold text-gray-900 flex items-center gap-2">
                                            <IconZap /> 智能解析：匯入廠商報價
                                        </h2>
                                        <p className="text-sm text-gray-500 mt-1">
                                            將從 PDF/LINE 擷取的文字，或 Excel 表格內容直接貼上，系統會自動拆解至「{activeSheet}」分頁中。
                                        </p>
                                    </div>
                                    <button onClick={() => setIsVendorModalOpen(false)} className="text-gray-400 hover:text-gray-900 transition-colors p-2">
                                        <IconX />
                                    </button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar flex flex-col">
                                    <div className="bg-blue-50 border border-blue-200 p-4 rounded-lg text-sm text-blue-800">
                                        <p className="font-bold mb-1">💡 最佳匯入格式建議：</p>
                                        <ul className="list-disc pl-5 space-y-1">
                                            <li><span className="font-medium">黃金準則：</span><code className="bg-white px-1 rounded text-blue-600">項目名稱 數量 單位 單價 備註</code> (以空白、逗號或 Tab 隔開)</li>
                                            <li><span className="font-medium">最準確方式：</span>直接從 Excel 全選表格並複製貼上。</li>
                                            <li><span className="font-medium">圖片/手寫：</span>原況文字擷取後，請確保文字間有空格。系統會自動利用「單位」與「數字」作為錨點精準分割。</li>
                                        </ul>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">此次報價廠商名稱 (選填)</label>
                                        <input 
                                            type="text" 
                                            value={vendorNameInput} 
                                            onChange={(e) => setVendorNameInput(e.target.value)} 
                                            placeholder="例如：振興工程行、特力屋..." 
                                            className="w-full border border-gray-300 rounded p-2 focus:border-blue-500 outline-none"
                                        />
                                    </div>

                                    <div className="flex-1 flex flex-col">
                                        <label className="block text-sm font-bold text-gray-700 mb-1">請在此貼上報價文字內容：</label>
                                        <textarea 
                                            value={vendorTextInput}
                                            onChange={(e) => setVendorTextInput(e.target.value)}
                                            placeholder="例如：\n油漆粉刷工程    1    式    45000\n木作天花板    20    坪    3200"
                                            className="w-full flex-1 border border-gray-300 rounded p-3 focus:border-blue-500 outline-none resize-none font-mono text-sm leading-relaxed min-h-[200px]"
                                        ></textarea>
                                    </div>
                                </div>

                                <div className="mt-6 flex justify-end gap-3 pt-4 border-t">
                                    <button onClick={() => setIsVendorModalOpen(false)} className="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-lg text-sm font-bold hover:bg-gray-200 transition">取消</button>
                                    <button onClick={processVendorImport} className="px-5 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 transition shadow-md flex items-center gap-2">
                                        <IconZap /> 執行智能解析
                                    </button>
                                </div>
                            </div>

                                                {/* 將原本的 tfoot 小計改為 tbody 內的最後一列，避免跨頁重複顯示 */}
                                                <tr>
                                                    <td colSpan={printMode === 'internal' ? "4" : "6"} className="text-right font-bold py-2 border-t border-gray-300">本項工程小計：</td>
                                                    {printMode === 'internal' ? (
                                                        <>
                                                            <td colSpan="2" className="text-right font-bold py-2 border-t border-gray-300 text-orange-700">{formatCurrency(catCost)}</td>
                                                            <td colSpan="2" className="text-right font-bold py-2 border-t border-gray-300 text-blue-700">{formatCurrency(catPrice)}</td>
                                                            <td className="text-right font-bold py-2 border-t border-gray-300 text-green-700">
                                                                {catPrice > 0 ? (((catPrice - catCost) / catPrice) * 100).toFixed(0) : "0"}%
                                                            </td>
                                                        </>
                                                    ) : (
                                                        <td className="text-right font-bold py-2 border-t border-gray-300">{formatCurrency(catPrice)}</td>
                                                    )}
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* --- 網頁操作介面 --- */}
                    <div className="no-print">
                        {/* 分頁標籤 */}
                        <div className="flex flex-wrap items-center gap-2 pb-4 mb-4 border-b border-gray-200">
                            {categories.map((category, idx) => {
                                const count = items.filter(i => i.sheetName === category).length;
                                const isActive = activeSheet === category;
                                const pageNumberText = CHINESE_NUMS[idx] || (idx + 1);
                                
                                const catActual = items.filter(i => i.sheetName === category).reduce((acc, i) => acc + (i.quantity * i.unitPrice), 0);
                                const hasWarning = targetBudgets[category] && catActual > targetBudgets[category];

                                return (
                                    <div key={category} 
                                        className={`group relative flex items-center px-4 py-2 rounded-lg text-sm font-medium transition-colors border cursor-pointer
                                            ${isActive ? 'border-gray-900 bg-gray-100 text-gray-900 shadow-sm' : 'border-gray-200 bg-white text-gray-500 hover:bg-gray-50 hover:text-gray-700'}`}
                                        onClick={() => setActiveSheet(category)}
                                    >
                                        {hasWarning && <span className="absolute -top-1 -right-1 flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>}
                                        
                                        {isActive && idx > 0 && (
                                            <button onClick={(e) => { e.stopPropagation(); handleMoveCategory('left'); }} className="mr-1.5 p-0.5 text-gray-400 hover:text-gray-900 bg-white hover:bg-gray-300 rounded transition-colors" title="往前移">
                                                <IconChevronLeft />
                                            </button>
                                        )}

                                        {pageNumberText}、
                                        {isActive ? (
                                            <input 
                                                type="text"
                                                defaultValue={category}
                                                onBlur={e => handleRenameCategory(category, e.target.value)}
                                                onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                                                onClick={e => e.stopPropagation()}
                                                className="bg-transparent outline-none border-b border-gray-400 focus:border-gray-900 w-auto min-w-[100px] max-w-[200px] font-bold text-gray-900 px-1 py-0.5"
                                                title="點擊修改分頁名稱"
                                            />
                                        ) : (
                                            <span>{category}</span>
                                        )}
                                        
                                        {count > 0 && <span className={`ml-2 py-0.5 px-2 rounded-full text-xs ${isActive ? 'bg-white shadow-sm' : 'bg-gray-100 text-gray-600'}`}>{count}</span>}
                                        
                                        {isActive && idx < categories.length - 1 && (
                                            <button onClick={(e) => { e.stopPropagation(); handleMoveCategory('right'); }} className="ml-1.5 p-0.5 text-gray-400 hover:text-gray-900 bg-white hover:bg-gray-300 rounded transition-colors" title="往後移">
                                                <IconChevronRight />
                                            </button>
                                        )}

                                        <button 
                                            onClick={(e) => { e.stopPropagation(); handleDeleteCategory(category); }}
                                            className={`ml-3 p-1 rounded-full hover:bg-red-100 hover:text-red-600 transition-colors ${isActive ? 'text-gray-400' : 'text-transparent group-hover:text-gray-300'}`}
                                            title="刪除此分頁"
                                        >
                                            <IconTrash2 />
                                        </button>
                                    </div>
                                );
                            })}
                            <button onClick={handleAddCategory} className="flex-shrink-0 p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-full transition bg-gray-100 border border-gray-200" title="新增分頁">
                                <IconPlus />
                            </button>
                        </div>

                        {/* 編輯表格 */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-visible mb-8">
                            <div className="overflow-x-auto overflow-y-visible pb-20">
                                <table className="w-full text-sm text-left whitespace-nowrap">
                                    <thead className="bg-gray-50 text-gray-600 font-bold border-b border-gray-200">
                                        <tr>
                                            <th className="px-4 py-3 w-16 text-center">項次</th>
                                            <th className="px-4 py-3 min-w-[200px]">項目名稱 *</th>
                                            <th className="px-4 py-3 w-32">分類</th>
                                            <th className="px-4 py-3 w-32">廠商</th>
                                            <th className="px-4 py-3 min-w-[150px]">報價備註</th>
                                            <th className="px-4 py-3 w-32 min-w-[120px] text-right">數量</th>
                                            <th className="px-4 py-3 w-20 text-center">單位</th>
                                            <th className="px-4 py-3 w-40 min-w-[140px] text-right text-orange-600">單位成本</th>
                                            <th className="px-4 py-3 w-40 min-w-[140px] text-right text-blue-600">單位報價</th>
                                            <th className="px-4 py-3 w-32 text-right">小計報價</th>
                                            <th className="px-4 py-3 w-20 text-right text-green-600">毛利率</th>
                                            <th className="px-4 py-3 w-28 text-center">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {groupedActiveItems.map(([catName, itemsInCat], catIdx) => {
                                            const catLetter = String.fromCharCode(65 + catIdx); 
                                            return (
                                                <React.Fragment key={catName}>
                                                    <tr className="bg-gray-100/70 border-y border-gray-200">
                                                        <td className="px-4 py-2 font-bold text-center text-gray-700">{catLetter}</td>
                                                        <td colSpan="11" className="px-4 py-2 font-bold text-blue-900 tracking-wide">
                                                            <input 
                                                                type="text" 
                                                                defaultValue={catName} 
                                                                onBlur={e => handleCategoryNameChange(catName, e.target.value)}
                                                                onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                                                                className="bg-transparent border-b border-transparent hover:border-gray-300 focus:border-blue-500 outline-none w-full max-w-sm transition-colors cursor-text py-0.5"
                                                                title="點擊以批次修改此分類名稱 (將同步更新該分類下所有工項)"
                                                                placeholder="輸入分類名稱..."
                                                            />
                                                        </td>
                                                    </tr>
                                                    {itemsInCat.map((item, itemIdx) => (
                                                        <tr key={item.id} className="hover:bg-gray-50 transition">
                                                            <td className="px-4 py-2 text-center font-medium text-gray-500">{itemIdx + 1}</td>
                                                            <td className="px-4 py-2">
                                                                <textarea 
                                                                    value={item.name} 
                                                                    onChange={e => {
                                                                        handleItemChange(item.id, 'name', e.target.value);
                                                                        e.target.style.height = 'auto'; e.target.style.height = (e.target.scrollHeight) + 'px';
                                                                    }}
                                                                    placeholder="輸入工項名稱..." 
                                                                    className="w-full border border-gray-200 rounded px-2 py-1 outline-none focus:border-blue-500 font-medium resize-none overflow-hidden align-middle leading-snug" 
                                                                    rows="1" style={{ minHeight: '34px' }}
                                                                />
                                                            </td>
                                                            <td className="px-4 py-2"><input type="text" value={item.category} onChange={e => handleItemChange(item.id, 'category', e.target.value)} placeholder="分類群組" className="w-full border border-gray-200 rounded px-2 py-1 outline-none focus:border-blue-500 text-xs" /></td>
                                                            <td className="px-4 py-2"><input type="text" value={item.provider} onChange={e => handleItemChange(item.id, 'provider', e.target.value)} className="w-full border border-gray-200 rounded px-2 py-1 outline-none focus:border-blue-500 text-xs" /></td>
                                                            <td className="px-4 py-2">
                                                                <textarea 
                                                                    value={item.note} 
                                                                    onChange={e => {
                                                                        handleItemChange(item.id, 'note', e.target.value);
                                                                        e.target.style.height = 'auto'; e.target.style.height = (e.target.scrollHeight) + 'px';
                                                                    }}
                                                                    placeholder="尺寸/規格..." 
                                                                    className="w-full border border-gray-200 rounded px-2 py-1 outline-none focus:border-blue-500 text-xs text-gray-500 resize-none overflow-hidden align-middle leading-snug" 
                                                                    rows="1" style={{ minHeight: '30px' }}
                                                                />
                                                            </td>
                                                            <td className="px-4 py-2"><input type="number" value={item.quantity} onChange={e => handleItemChange(item.id, 'quantity', parseFloat(e.target.value) || 0)} className="w-full text-right border border-gray-200 rounded px-2 py-1 outline-none focus:border-blue-500" min="0" step="0.1" /></td>
                                                            <td className="px-4 py-2"><input type="text" value={item.unit} onChange={e => handleItemChange(item.id, 'unit', e.target.value)} className="w-full text-center border border-gray-200 rounded px-1 py-1 outline-none focus:border-blue-500" /></td>
                                                            <td className="px-4 py-2"><input type="number" value={item.unitCost} onChange={e => handleItemChange(item.id, 'unitCost', parseFloat(e.target.value) || 0)} className="w-full text-right border border-orange-200 bg-orange-50 rounded px-2 py-1 outline-none focus:border-orange-500 text-orange-700" min="0" step="100" /></td>
                                                            <td className="px-4 py-2"><input type="number" value={item.unitPrice} onChange={e => handleItemChange(item.id, 'unitPrice', parseFloat(e.target.value) || 0)} className="w-full text-right border border-blue-200 bg-blue-50 rounded px-2 py-1 outline-none focus:border-blue-500 text-blue-700 font-bold" min="0" step="100" /></td>
                                                            <td className="px-4 py-2 text-right font-bold text-gray-800">{formatCurrency(item.quantity * item.unitPrice)}</td>
                                                            <td className="px-4 py-2 text-right font-bold text-green-600 bg-green-50/50">{item.unitPrice > 0 ? (((item.unitPrice - item.unitCost) / item.unitPrice) * 100).toFixed(1) : "0.0"}%</td>
                                                            <td className="px-4 py-2 text-center whitespace-nowrap">
                                                                <button onClick={() => handleMoveItem(item.id, 'up')} className="text-gray-400 hover:text-blue-600 transition p-1" title="上移"><IconArrowUp /></button>
                                                                <button onClick={() => handleMoveItem(item.id, 'down')} className="text-gray-400 hover:text-blue-600 transition p-1" title="下移"><IconArrowDown /></button>
                                                                <button onClick={() => handleRemoveItem(item.id)} className="text-red-400 hover:text-red-600 transition p-1" title="刪除"><IconTrash2 /></button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </React.Fragment>
                                            );
                                        })}
                                        <tr className="bg-gray-50">
                                            <td colSpan="12" className="px-4 py-4 flex gap-3 flex-wrap">
                                                <button onClick={handleAddItem} className="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 text-gray-700 hover:text-blue-600 hover:border-blue-400 rounded-lg font-medium text-sm transition shadow-sm">
                                                    <IconPlus /> 手動新增一筆
                                                </button>
                                                
                                                {/* 🌟 新增的廠商報價匯入按鈕 */}
                                                <button onClick={() => setIsVendorModalOpen(true)} className="flex items-center gap-2 px-4 py-2 bg-blue-50 border border-blue-200 text-blue-700 hover:bg-blue-600 hover:text-white rounded-lg font-medium text-sm transition shadow-sm group">
                                                    <IconZap /> 智能貼上 / 匯入廠商報價
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                    
                                    {/* --- 表尾：成本小計、報價小計、與目標預算之比對 --- */}
                                    <tfoot className="border-t-2 border-gray-300">
                                        <tr className="bg-orange-50/50 no-print">
                                            <td colSpan="9" className="px-4 py-3 text-right font-bold text-orange-600">本頁成本小計 (不列印)：</td>
                                            <td className="px-4 py-3 text-right font-bold text-orange-600 text-lg border-b-2 border-transparent">{formatCurrency(activeSheetTotalCost)}</td>
                                            <td colSpan="2"></td>
                                        </tr>
                                        <tr className="bg-white">
                                            <td colSpan="9" className="px-4 py-3 text-right font-bold text-gray-500">本頁細項小計 (報價)：</td>
                                            <td className="px-4 py-3 text-right font-bold text-gray-800 text-lg border-b-2 border-transparent">{formatCurrency(activeSheetTotalPrice)}</td>
                                            <td colSpan="2"></td>
                                        </tr>
                                        {targetBudgets[activeSheet] > 0 && (
                                            <tr className="bg-amber-50/50">
                                                <td colSpan="9" className="px-4 py-3 text-right font-bold text-amber-700 border-t border-amber-100">預先規劃之目標預算：</td>
                                                <td className="px-4 py-3 text-right font-bold text-amber-700 text-lg border-t border-amber-100">{formatCurrency(targetBudgets[activeSheet])}</td>
                                                <td colSpan="2" className="px-4 py-3 text-left font-bold text-sm border-t border-amber-100">
                                                    {targetBudgets[activeSheet] >= activeSheetTotalPrice 
                                                        ? <span className="text-emerald-600 bg-emerald-100 px-2 py-1 rounded-md">🟢 安全餘額：{formatCurrency(targetBudgets[activeSheet] - activeSheetTotalPrice)}</span>
                                                        : <span className="text-red-600 bg-red-100 px-2 py-1 rounded-md animate-pulse">🔴 超出預算：{formatCurrency(activeSheetTotalPrice - targetBudgets[activeSheet])}</span>
                                                    }
                                                </td>
                                            </tr>
                                        )}
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                        {/* 附加費用與稅金設定 */}
                        <div className="flex flex-wrap items-center justify-end gap-4 mb-4 no-print">
                            <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-gray-200 shadow-sm hover:border-blue-300 transition-colors">
                                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">設計費</label>
                                <input type="number" value={designFee} onChange={e => setDesignFee(parseFloat(e.target.value) || 0)} className="w-24 outline-none text-right font-bold text-blue-700 bg-transparent" min="0" step="1000" />
                            </div>
                            <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-gray-200 shadow-sm hover:border-blue-300 transition-colors">
                                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">工程監管費 (%)</label>
                                <input type="number" value={managementFeeRate} onChange={e => setManagementFeeRate(parseFloat(e.target.value) || 0)} className="w-16 outline-none text-right font-bold text-blue-700 bg-transparent" min="0" step="0.1" />
                            </div>
                            <label className="flex items-center gap-2 cursor-pointer text-sm font-bold text-gray-700 bg-white px-4 py-2 rounded-lg border border-gray-200 shadow-sm hover:bg-gray-50 hover:border-blue-300 transition-colors">
                                <input type="checkbox" checked={includeTax} onChange={e => setIncludeTax(e.target.checked)} className="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                                加計 5% 營業稅
                            </label>
                        </div>

                        {/* 總計與成本儀表板 */}
                        <div className="bg-white border-t-2 border-gray-900 px-6 py-8 flex flex-col md:flex-row justify-between items-end gap-6 shadow-sm mb-12 relative overflow-hidden rounded-b-xl">
                            <div className="w-full md:w-auto space-y-3 text-sm text-gray-600 z-10">
                                <div className="flex justify-between md:w-72">
                                    <span className="font-medium">未稅工程細項總計</span> 
                                    <span className="font-semibold text-gray-800">{formatCurrency(netTotalPrice)}</span>
                                </div>
                                <div className="flex justify-between md:w-72">
                                    <span className="font-medium">工程監管費 ({managementFeeRate}%)</span> 
                                    <span className="font-semibold text-gray-800">{formatCurrency(managementFee)}</span>
                                </div>
                                {designFee > 0 && (
                                    <div className="flex justify-between md:w-72">
                                        <span className="font-medium">設計費</span> 
                                        <span className="font-semibold text-gray-800">{formatCurrency(designFee)}</span>
                                    </div>
                                )}
                                {includeTax && (
                                    <div className="flex justify-between md:w-72">
                                        <span className="font-medium">營業稅 (5%)</span> 
                                        <span className="font-semibold text-gray-800">{formatCurrency(tax)}</span>
                                    </div>
                                )}
                            </div>
                            
                            <div className="w-full md:w-auto text-right border-t border-gray-100 md:border-none pt-6 md:pt-0 z-10">
                                <div className="text-gray-400 text-xs font-bold tracking-[0.2em] mb-2 uppercase">{includeTax ? '實際含稅總預算金額' : '實際總預算金額'}</div>
                                <div className="text-4xl md:text-5xl font-black text-gray-900 tracking-tight">{formatCurrency(grossTotal)}</div>
                                <div className="text-xs text-gray-500 mt-3 font-medium flex items-center justify-end gap-3">
                                    <span className="bg-gray-100 px-2 py-1 rounded">總成本 {formatCurrency(totalCost)}</span>
                                    <span className="bg-gray-100 px-2 py-1 rounded">總毛利 {formatCurrency(profit)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
