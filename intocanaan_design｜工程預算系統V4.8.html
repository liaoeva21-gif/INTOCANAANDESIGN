        const IconArrowDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>;

        const IconInsertBelow = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 4v8"/><path d="m16 8-4 4-4-4"/><line x1="4" x2="20" y1="20" y2="20"/></svg>;
        const IconSliders = () => <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>;

        const generateId = () => Math.floor(Math.random() * 10000000).toString();

        const CHINESE_NUMS = [
            "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", 
            "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
            "二十一", "二十二", "二十三", "二十四", "二十五", "二十六", "二十七", "二十八", "二十九", "三十"
        ];
        
        const DEFAULT_NOTES = `1. 報價有效期限為30天。
2. 此報價單在客戶回簽後視同正式合約，付款方式依照合約付款。
3. 此專案依本報價單為主，內容若有變更視之追加減，若超出設定項目或材質視為追加。
4. 本專案自正式驗收日起保固壹年，保固期內如因施作或材料不良而有所損壞者，本公司應負免費修復之責任；但因不可抗力或非可歸責於本公司之事由造成之損壞，不在此限。`;

        // 自動調整高度的 Textarea 元件
        const AutoResizeTextarea = ({ value, onChange, placeholder, className, rows = 1, style = {} }) => {
            const textareaRef = useRef(null);
            useEffect(() => {
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px';
                }
            }, [value]);
            return (
                <textarea
                    ref={textareaRef}
                    value={value || ""}
                    onChange={onChange}
                    placeholder={placeholder}
                    className={`resize-none overflow-hidden align-middle leading-snug outline-none transition-colors ${className}`}
                    rows={rows}
                    style={{ minHeight: '32px', ...style }}
                />
            );
        };

        function App() {
            // --- 狀態管理 ---
            const DEFAULT_CATEGORIES = [
                "假設保護與拆除工程", "鋁窗工程", "泥作工程", "水電工程", "空調工程", 
                "木作天花隔間工程", "木作櫃工程", "鐵工工程", "油漆工程", "地坪工程", 
                "廚具工程", "燈具設備", "衛浴設備", "人造石工程", "玻璃工程", 
                "五金設備", "窗簾工程", "其他工程", "清潔工程"
            ];
            const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
            const [projectInfo, setProjectInfo] = useState({
                projectId: "", projectName: "", budgetTitle: "", date: new Date().toISOString().split('T')[0], notes: DEFAULT_NOTES
            });
            const [targetBudgets, setTargetBudgets] = useState({});
            const [managementFeeRate, setManagementFeeRate] = useState(10);
            const [includeTax, setIncludeTax] = useState(true);
            const [designFee, setDesignFee] = useState(0);

            const [items, setItems] = useState([
                { id: generateId(), sheetName: "假設保護與拆除工程", status: "○○", name: "公共區域保護", category: "保護工程", provider: "振興工程行", internalNote: "", note: "公共區域梯間地坪防護", quantity: 1, unit: "式", unitCost: 6000, unitPrice: 7500 },
                { id: generateId(), sheetName: "假設保護與拆除工程", status: "○○", name: "室內木作拆除", category: "拆除工程", provider: "振興工程行", internalNote: "", note: "全室天花與櫃體", quantity: 1, unit: "式", unitCost: 15000, unitPrice: 20000 },
                { id: generateId(), sheetName: "水電工程", status: "○○", name: "開關箱更新打槽固定及配線整理", category: "插座開關電力工程", provider: "樂川工程有限公司", internalNote: "", note: "", quantity: 1, unit: "式", unitCost: 28000, unitPrice: 35000 },
            ]);
            
            const [activeSheet, setActiveSheet] = useState(categories[0]);
            
            const fileInputRef = useRef(null);
            const csvInputRef = useRef(null);
            const txtInputRef = useRef(null); 

            // Google Drive 狀態
            const [tokenClient, setTokenClient] = useState(null);
            const [googleAccessToken, setGoogleAccessToken] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [cloudFiles, setCloudFiles] = useState([]);
            const [isFetchingFiles, setIsFetchingFiles] = useState(false);

            // 廠商報價匯入狀態
            const [isVendorModalOpen, setIsVendorModalOpen] = useState(false);
            const [vendorNameInput, setVendorNameInput] = useState("");
            const [vendorTextInput, setVendorTextInput] = useState("");

            // 數量計算表連動狀態
            const [isQuantityModalOpen, setIsQuantityModalOpen] = useState(false);
            const [quantityTextInput, setQuantityTextInput] = useState("");

            const [printMode, setPrintMode] = useState('quote'); 

            useEffect(() => {
                let isMounted = true;
                const initGIS = () => {
                    if (window.google && window.google.accounts && isMounted) {
                        const client = window.google.accounts.oauth2.initTokenClient({
                            client_id: CLIENT_ID,
                            scope: SCOPES,
                            callback: (tokenResponse) => {
                                if (tokenResponse && tokenResponse.access_token) {
                                    setGoogleAccessToken(tokenResponse.access_token);
                                }
                            },
                            error_callback: (err) => {
                                console.error("GIS Error:", err);
                                alert('Google 授權失敗，請確認 Client ID 或網域設定。');
                            }
                        });
                        setTokenClient(client);
                    }
                };
                
                if (window.google && window.google.accounts) {
                    initGIS();
                } else {
                    const googleScript = document.getElementById('google-gsi-client');
                    if (googleScript) {
                        googleScript.addEventListener('load', initGIS);
                    }
                }
                return () => { isMounted = false; };
            }, []);

            const handleGoogleAuth = () => {
                if (CLIENT_ID.includes('您的_CLIENT_ID')) {
                    alert("請先在程式碼中填寫您的 Google API Client ID！");
                    return;
                }
                if (!tokenClient) return alert('Google SDK 尚未載入完成，請稍候再試。');
                tokenClient.requestAccessToken();
            };

            const handleSaveToDrive = async () => {
                if (!googleAccessToken) {
                    handleGoogleAuth();
                    return;
                }

                const projName = projectInfo.projectName.trim();
                if (!projName) return alert("請先填寫「專案名稱」做為儲存識別檔名！");

                setIsUploading(true);
                const fileName = `${projName}_IntocanaanEngineering.json`;
                const stateData = { projectInfo, categories, items, targetBudgets, managementFeeRate, includeTax, designFee };
                const fileContent = JSON.stringify(stateData, null, 2);

                try {
                    const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${fileName}' and trashed=false`, {
                        headers: { Authorization: `Bearer ${googleAccessToken}` }
                    });
                    const searchData = await searchRes.json();

                    const metadata = { name: fileName, mimeType: 'application/json' };
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', new Blob([fileContent], { type: 'application/json' }));

                    let uploadUrl = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
                    let method = 'POST'; 

                    if (searchData.files && searchData.files.length > 0) {
                        uploadUrl = `https://www.googleapis.com/upload/drive/v3/files/${searchData.files[0].id}?uploadType=multipart`;
                        method = 'PATCH';
                    }

                    const uploadRes = await fetch(uploadUrl, {
                        method: method,
                        headers: { Authorization: `Bearer ${googleAccessToken}` },
                        body: form
                    });

                    if (uploadRes.ok) alert("✅ 成功儲存至 Google 雲端硬碟！");
                    else throw new Error("上傳失敗");
                } catch (error) {
                    console.error("Google Drive API Error:", error);
                    alert("儲存失敗，請確認網路或重新授權。");
                } finally {
                    setIsUploading(false);
                }
            };

            const openCloudModal = async () => {
                setIsModalOpen(true);
                if (googleAccessToken) fetchDriveFiles();
            };

            const fetchDriveFiles = async () => {
                setIsFetchingFiles(true);
                try {
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name contains '_IntocanaanEngineering.json' and trashed=false&fields=files(id, name, modifiedTime)&orderBy=modifiedTime desc`, {
                        headers: { Authorization: `Bearer ${googleAccessToken}` }
                    });
                    const data = await res.json();
                    setCloudFiles(data.files || []);
                } catch (error) {
                    console.error(error);
                    alert("讀取失敗，可能是授權過期。請重新整理頁面。");
                } finally {
                    setIsFetchingFiles(false);
                }
            };

            const loadDriveFile = async (fileId) => {
                try {
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                        headers: { Authorization: `Bearer ${googleAccessToken}` }
                    });
                    const parsed = await res.json();
                    
                    if (parsed.projectInfo) setProjectInfo({...parsed.projectInfo, notes: parsed.projectInfo.notes !== undefined ? parsed.projectInfo.notes : DEFAULT_NOTES});
                    if (parsed.items) setItems(parsed.items);
                    if (parsed.targetBudgets) setTargetBudgets(parsed.targetBudgets);
                    if (parsed.managementFeeRate !== undefined) setManagementFeeRate(parsed.managementFeeRate);
                    if (parsed.includeTax !== undefined) setIncludeTax(parsed.includeTax);
                    if (parsed.designFee !== undefined) setDesignFee(parsed.designFee);
                    
                    let importedCategories = parsed.categories;
                    if (!importedCategories || importedCategories.length === 0) {
                        importedCategories = parsed.items && parsed.items.length > 0 
                            ? [...new Set(parsed.items.map(i => i.sheetName))] 
                            : DEFAULT_CATEGORIES;
                    }
                    setCategories(importedCategories);
                    if (importedCategories.length > 0) setActiveSheet(importedCategories[0]);
                    
                    setIsModalOpen(false);
                    alert("✅ 專案載入成功！");
                } catch (error) {
                    console.error(error);
                    alert("載入檔案失敗，檔案可能已損毀。");
                }
            };

            // --- 計算與邏輯 ---
            const currentSheetItems = useMemo(() => items.filter(item => item.sheetName === activeSheet), [items, activeSheet]);
            
            const { totalCost, netTotalPrice } = useMemo(() => {
                return items.reduce((acc, item) => ({
                    totalCost: acc.totalCost + ((item.quantity || 0) * (item.unitCost || 0)),
                    netTotalPrice: acc.netTotalPrice + ((item.quantity || 0) * (item.unitPrice || 0))
                }), { totalCost: 0, netTotalPrice: 0 });

                    note: "",

                    unit: "式",
                    unitCost: 0,
                    unitPrice: 0
                }));

                const insertIndex = direction === 'above' ? itemIndexInGlobal : itemIndexInGlobal + 1;
                const newItemsList = [...items];
                newItemsList.splice(insertIndex, 0, ...newItemsToInsert);
                setItems(newItemsList);
            };

            const handleItemChange = (id, field, value) => {
                setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));

            const handleMarginChange = (id, newMarginStr) => {
                let margin = parseFloat(newMarginStr);
                if (isNaN(margin)) margin = 0;
                if (margin < 0) margin = 0;
                if (margin >= 100) margin = 99.9; 

                setItems(items.map(item => {
                    if (item.id === id) {
                        const newPrice = item.unitCost === 0 ? 0 : Math.round(item.unitCost / (1 - (margin / 100)));
                        return { ...item, unitPrice: newPrice };
                    }
                    return item;
                }));
            };

            const handleRemoveItem = (id) => setItems(items.filter(item => item.id !== id));

            const handleMoveItem = (id, direction) => {
                const itemIndexInGlobal = items.findIndex(i => i.id === id);
                if (itemIndexInGlobal < 0) return;

                const sheetItemsList = items.filter(i => i.sheetName === activeSheet);
                const indexInSheet = sheetItemsList.findIndex(i => i.id === id);

                if (direction === 'up' && indexInSheet > 0) {
                    const targetId = sheetItemsList[indexInSheet - 1].id;
                    const targetIndexGlobal = items.findIndex(i => i.id === targetId);
                    const newItems = [...items];
                    [newItems[itemIndexInGlobal], newItems[targetIndexGlobal]] = [newItems[targetIndexGlobal], newItems[itemIndexInGlobal]];
                    setItems(newItems);
                } else if (direction === 'down' && indexInSheet < sheetItemsList.length - 1) {
                    const targetId = sheetItemsList[indexInSheet + 1].id;
                    const targetIndexGlobal = items.findIndex(i => i.id === targetId);
                    const newItems = [...items];
                    [newItems[itemIndexInGlobal], newItems[targetIndexGlobal]] = [newItems[targetIndexGlobal], newItems[itemIndexInGlobal]];
                    setItems(newItems);

            const handleCategoryNameChange = (oldCatName, newCatName) => {

            };

            const handleMoveCategory = (direction) => {

                if (direction === 'left' && index > 0) {
                    [newCats[index - 1], newCats[index]] = [newCats[index], newCats[index - 1]];
                    setCategories(newCats);
                } else if (direction === 'right' && index < categories.length - 1) {

                    setCategories(newCats);

            const handleRenameCategory = (oldName, newName) => {

                setCategories(categories.map(c => c === oldName ? finalName : c));
                setItems(items.map(item => item.sheetName === oldName ? { ...item, sheetName: finalName } : item));
                if (activeSheet === oldName) setActiveSheet(finalName);
                
                if (targetBudgets[oldName] !== undefined) {

            const processVendorImport = () => {
                if (!vendorTextInput.trim()) {
                    alert("請貼上文字內容！");
                    return;
                }

                const lines = vendorTextInput.split('\n').filter(l => l.trim() !== '');
                let parsedItems = [];
                let successCount = 0;
                
                const commonUnits = ['式', '一式', '坪', '樘', '尺', '公尺', 'm', 'cm', '組', '台', '才', '迴', '處', '口', '趟', '份', '個', '套', '批', '間', '車', '車次', '工', '天', 'm2', '才/尺', '片', '支', '式/月', '月'];

                lines.forEach(line => {
                    let parts = line.split(/\t/).map(p => p.trim()).filter(p => p !== '');
                    if (parts.length <= 1 && line.includes(',')) {
                        parts = line.split(/,/).map(p => p.trim()).filter(p => p !== '');
                    }
                    if (parts.length <= 1) {
                        parts = line.split(/(?:\s{2,}| +)/).map(p => p.trim()).filter(p => p !== '');
                    }
                    if (parts.length <= 1) {
                        parts = line.split(/\s+/).map(p => p.trim()).filter(p => p !== '');
                    }

                    if (parts.length > 0) {
                        if (parts.length > 1 && /^(\(?\d+[\.\-、\)]?)$/.test(parts[0])) {
                            parts.shift();
                        }

                        const isStrictNum = (str) => {
                            let cleanStr = str.replace(/[,$NTnt]/g, '');
                            return cleanStr !== '' && !isNaN(cleanStr) && /^[\d]+(\.[\d]+)?$/.test(cleanStr);
                        };
                        const getNum = (str) => parseFloat(str.replace(/[,$NTnt]/g, ''));

                        let nums = [];
                        parts.forEach((p, i) => { if (isStrictNum(p)) nums.push(i); });
                        
                        let uIdx = parts.findIndex(p => commonUnits.includes(p));
                        let qIdx = -1;
                        let pIdx = -1;
                        let sIdx = -1; 

                        if (nums.length === 1) {
                            pIdx = nums[0];
                        } else if (nums.length >= 2) {
                            if (uIdx !== -1) {
                                if (nums.includes(uIdx - 1)) qIdx = uIdx - 1;
                                let afterUnit = nums.find(n => n > uIdx);
                                if (afterUnit) pIdx = afterUnit;
                            } else {
                                qIdx = nums[0];
                                pIdx = nums[1];
                            }
                        }

                        if (pIdx === -1 && nums.length > 0) {
                            pIdx = nums[nums.length - 1];
                        }
                        if (qIdx === pIdx) qIdx = -1; 

                        if (pIdx !== -1) {
                            let nextNumIdx = nums.find(n => n > pIdx);
                            if (nextNumIdx === pIdx + 1) {
                                sIdx = nextNumIdx;
                            }
                        }

                        let quantity = qIdx !== -1 ? getNum(parts[qIdx]) : 1;
                        let price = pIdx !== -1 ? getNum(parts[pIdx]) : 0;
                        let unit = uIdx !== -1 ? parts[uIdx] : '式';

                        let usedIndices = [qIdx, uIdx, pIdx, sIdx].filter(i => i !== -1);
                        let firstSpecial = usedIndices.length > 0 ? Math.min(...usedIndices) : parts.length;
                        let lastSpecial = usedIndices.length > 0 ? Math.max(...usedIndices) : -1;

                        let name = parts.slice(0, firstSpecial).join(' ') || '未命名';
                        let note = usedIndices.length > 0 ? parts.slice(lastSpecial + 1).join(' ') : '';

                        if (unit && unit.length > 4) {
                            note = (unit + " " + note).trim();
                            unit = "式";
                        }

                        if (name && name !== '未命名') {
                            parsedItems.push({
                                id: generateId() + Math.floor(Math.random()*1000).toString(),
                                sheetName: activeSheet,
                                status: "○○",
                                name: name,
                                category: activeSheet, 
                                provider: vendorNameInput || "未指定廠商",
                                internalNote: "",
                                note: note,
                                quantity: quantity,
                                unit: unit,
                                unitCost: price,
                                unitPrice: price
                            });
                            successCount++;
                        }
                    }
                });

                if (successCount > 0) {
                    setItems([...items, ...parsedItems]);
                    alert(`✅ 成功解析並匯入 ${successCount} 筆工項至「${activeSheet}」！`);
                    setIsVendorModalOpen(false);
                    setVendorTextInput("");
                } else {
                    alert("無法解析貼上的文字，請確認是否包含有效的欄位與數值。");
                }
            };

            const processQuantityImport = () => {
                if (!quantityTextInput.trim()) {
                    alert("請貼上文字內容！");
                    return;
                }

                const lines = quantityTextInput.split('\n').filter(l => l.trim() !== '');
                let newItems = [...items];
                let updateCount = 0;
                let qtyMap = {};

                lines.forEach(line => {
                    let parts = line.split(/\t/).map(p => p.trim()).filter(p => p !== '');
                    if (parts.length <= 1 && line.includes(',')) parts = line.split(/,/).map(p => p.trim()).filter(p => p !== '');
                    if (parts.length <= 1) parts = line.split(/(?:\s{2,}| +)/).map(p => p.trim()).filter(p => p !== '');
                    if (parts.length <= 1) parts = line.split(/\s+/).map(p => p.trim()).filter(p => p !== '');

                    if (parts.length >= 2) {
                        if (/^(\(?\d+[\.\-、\)]?)$/.test(parts[0])) parts.shift();
                        
                        let name = parts[0];
                        let qty = null;
                        
                        for (let j = 1; j < parts.length; j++) {
                            let cleanStr = parts[j].replace(/[,$NTnt]/g, '');
                            if (cleanStr !== '' && !isNaN(cleanStr) && /^[\d]+(\.[\d]+)?$/.test(cleanStr)) {
                                qty = parseFloat(cleanStr);
                                break; 
                            }
                        }
                        
                        if (name && qty !== null) {
                            qtyMap[name.replace(/\s+/g, '')] = qty;
                        }
                    }
                });

                newItems = newItems.map(item => {
                    const cleanItemName = item.name.replace(/\s+/g, '');
                    if (cleanItemName && qtyMap[cleanItemName] !== undefined) {
                        updateCount++;
                        return { ...item, quantity: qtyMap[cleanItemName] };
                    }
                    return item;
                });

                if (updateCount > 0) {
                    setItems(newItems);
                    alert(`✅ 成功比對並更新 ${updateCount} 筆工項數量！`);
                    setIsQuantityModalOpen(false);
                    setQuantityTextInput("");

                }
            };

            const handleExportJSON = () => {
                const data = JSON.stringify({ projectInfo, categories, items, targetBudgets, managementFeeRate, includeTax, designFee }, null, 2);
                const blob = new Blob(["\uFEFF" + data], { type: "application/json;charset=utf-8" });

                const a = document.createElement('a');
                a.href = url;
                a.download = `${projectInfo.projectName || '未命名專案'}_預算設定.json`;

            const handleImportJSON = (e) => {

                };
                reader.readAsText(file, "UTF-8");
                e.target.value = null;
            };

            const handleImportAllocationCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                const executeParse = (text) => {
                    try {
                        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
                        let newTargets = { ...targetBudgets };
                        let newCats = [...categories];
                        let parsingItems = false;
                        let newProjectName = projectInfo.projectName;
                        let importCount = 0;
                        
                        const parseCSVRow = (row) => {
                            const result = []; let cur = ''; let inQuotes = false;
                            for (let i = 0; i < row.length; i++) {
                                const char = row[i];
                                if (char === '"' && row[i+1] === '"') { cur += '"'; i++; }
                                else if (char === '"') inQuotes = !inQuotes;
                                else if (char === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
                                else cur += char;
                            }
                            result.push(cur.trim()); return result;
                        };
                        
                        for (let i = 0; i < lines.length; i++) {
                            const cols = parseCSVRow(lines[i]);
                            const col0 = cols[0] || '';
                            
                            if (col0.includes('專案名稱') && i + 1 < lines.length) {
                                const dataCols = parseCSVRow(lines[i + 1]);
                                if (dataCols[0] && !dataCols[0].includes('工項名稱')) newProjectName = dataCols[0].replace(/^"|"$/g, '').trim();
                            }
                            
                            if (col0.includes('工項名稱') || col0.includes('工程項目')) { parsingItems = true; continue; }

                                }

                                const amount = parseInt(String(amountStr).replace(/[^0-9]/g, ''), 10);
                                
                                if (catName && !isNaN(amount) && amount > 0) {
                                    newTargets[catName] = amount; importCount++;
                                    if (!newCats.includes(catName)) newCats.push(catName);
                                }
                            }
                        }
                        
                        if (importCount === 0) return alert("⚠️ 未能成功讀取任何目標預算。");
                        
                        setTargetBudgets(newTargets);
                        setCategories(newCats);
                        setProjectInfo(prev => ({ ...prev, projectName: newProjectName }));
                        alert(`✅ 成功連動匯入「預算分配表」！\n專案名稱：${newProjectName}\n載入 ${importCount} 項目標預算`);
                    } catch (err) { alert("匯入失敗，請確認檔案格式。"); }
                };

                reader.onload = (event) => {
                    const text = event.target.result;

                        readerBig5.onload = (e2) => executeParse(e2.target.result);

                            "wis_preparing", item.name || null, item.category || null, item.provider || null, item.internalNote || null, item.note || null,

                                return (
                                    <div key={`print-${category}`} className="mb-8">
                                        <h2 className="text-xs font-bold mb-2 bg-zinc-100 p-1.5 border border-zinc-300 page-break-inside-avoid">
                                            {pageNumberText}、{category}
                                        </h2>
                                        <table className="w-full mb-2 text-xs">
                                            <thead>
                                                <tr>
                                                    <th className="w-10 text-center">項次</th>
                                                    <th className="text-left w-1/4">項目</th>
                                                    {printMode === 'quote' && <th className="text-left">備註</th>}
                                                    <th className="text-right w-12">數量</th>
                                                    <th className="text-center w-10">單位</th>
                                                    {printMode === 'internal' && <th className="text-right w-20 text-amber-900">單位成本</th>}
                                                    {printMode === 'internal' && <th className="text-right w-20 text-amber-900">成本總計</th>}
                                                    <th className={`text-right ${printMode === 'internal' ? 'w-20' : 'w-24'}`}>單價</th>
                                                    <th className={`text-right ${printMode === 'internal' ? 'w-20' : 'w-24'}`}>複價</th>
                                                    {printMode === 'internal' && <th className="text-right w-16 text-emerald-900">毛利</th>}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {groupedPrintItems.map(([catName, itemsInCat], catIdx) => {
                                                    const catLetter = String.fromCharCode(65 + catIdx); 
                                                    return (
                                                        <React.Fragment key={catName}>
                                                            <tr className="bg-zinc-50 font-bold border-b border-zinc-200">
                                                                <td className="text-center text-zinc-700">{catLetter}</td>
                                                                <td colSpan={printMode === 'internal' ? "9" : "7"} className="text-zinc-900">{catName}</td>
                                                            </tr>
                                                            {itemsInCat.map((item, itemIdx) => (
                                                                <tr key={`print-item-${item.id}`}>
                                                                    <td className="text-center font-medium text-zinc-500">{itemIdx + 1}</td>
                                                                    <td className="font-medium">
                                                                        {item.name}
                                                                        {printMode === 'internal' && item.note && (
                                                                            <div className="text-[10px] text-zinc-500 font-normal">{item.note}</div>
                                                                        )}
                                                                    </td>
                                                                    {printMode === 'quote' && <td className="text-zinc-600 text-[10px]">{item.note}</td>}
                                                                    <td className="text-right">{item.quantity}</td>
                                                                    <td className="text-center">{item.unit}</td>
                                                                    {printMode === 'internal' && <td className="text-right text-amber-900">{formatCurrency(item.unitCost)}</td>}
                                                                    {printMode === 'internal' && <td className="text-right font-bold text-amber-900">{formatCurrency(item.quantity * item.unitCost)}</td>}
                                                                    <td className="text-right">{formatCurrency(item.unitPrice)}</td>
                                                                    <td className="text-right font-bold">{formatCurrency(item.quantity * item.unitPrice)}</td>
                                                                    {printMode === 'internal' && <td className="text-right font-bold text-emerald-900">
                                                                        {item.unitPrice > 0 ? (((item.unitPrice - item.unitCost) / item.unitPrice) * 100).toFixed(0) : "0"}%
                                                                    </td>}
                                                                </tr>
                                                            ))}
                                                        </React.Fragment>
                                                    );
                                                })}
                                                <tr>
                                                    <td colSpan={printMode === 'internal' ? "4" : "6"} className="text-right font-bold py-1.5 border-t border-zinc-300">本項工程小計：</td>
                                                    {printMode === 'internal' ? (
                                                        <>
                                                            <td colSpan="2" className="text-right font-bold py-1.5 border-t border-zinc-300 text-amber-900">{formatCurrency(catCost)}</td>
                                                            <td colSpan="2" className="text-right font-bold py-1.5 border-t border-zinc-300 text-zinc-900">{formatCurrency(catPrice)}</td>
                                                            <td className="text-right font-bold py-1.5 border-t border-zinc-300 text-emerald-900">
                                                                {catPrice > 0 ? (((catPrice - catCost) / catPrice) * 100).toFixed(0) : "0"}%
                                                            </td>
                                                        </>
                                                    ) : (
                                                        <td className="text-right font-bold py-1.5 border-t border-zinc-300">{formatCurrency(catPrice)}</td>
                                                    )}
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* --- 網頁操作介面 --- */}
                    <div className="no-print">
                        {/* 分頁頁籤 */}
                        <div className="flex flex-wrap items-center gap-1.5 pb-3 mb-4 border-b border-zinc-200">
                            {categories.map((category, idx) => {
                                const count = items.filter(i => i.sheetName === category).length;
                                const isActive = activeSheet === category;
                                const pageNumberText = CHINESE_NUMS[idx] || (idx + 1);
                                
                                const catActual = items.filter(i => i.sheetName === category).reduce((acc, i) => acc + ((i.quantity || 0) * (i.unitPrice || 0)), 0);
                                const hasWarning = targetBudgets[category] && catActual > targetBudgets[category];

                                return (
                                    <div key={category} 
                                        className={`group relative flex items-center px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer border
                                            ${isActive ? 'border-zinc-900 bg-zinc-900 text-white shadow-2xs' : 'border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-50'}`}
                                        onClick={() => setActiveSheet(category)}
                                    >
                                        {hasWarning && <span className="absolute -top-1 -right-1 flex h-2.5 w-2.5"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span></span>}
                                        
                                        {isActive && idx > 0 && (
                                            <button onClick={(e) => { e.stopPropagation(); handleMoveCategory('left'); }} className="mr-1 text-zinc-400 hover:text-white" title="往前移">
                                                <IconChevronLeft />
                                            </button>
                                        )}

                                        <span className="opacity-70 mr-0.5">{pageNumberText}、</span>
                                        {isActive ? (
                                            <input 
                                                type="text"
                                                defaultValue={category}
                                                onBlur={e => handleRenameCategory(category, e.target.value)}
                                                onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                                                onClick={e => e.stopPropagation()}
                                                className="bg-transparent outline-none border-b border-zinc-500 focus:border-white text-white font-bold px-0.5 py-0 min-w-[80px] max-w-[160px]"
                                                title="點擊修改名稱"
                                            />
                                        ) : (
                                            <span>{category}</span>
                                        )}
                                        
                                        {count > 0 && <span className={`ml-1.5 px-1.5 py-0.2 rounded-full text-[10px] ${isActive ? 'bg-zinc-800 text-zinc-300' : 'bg-zinc-100 text-zinc-500'}`}>{count}</span>}
                                        
                                        {isActive && idx < categories.length - 1 && (
                                            <button onClick={(e) => { e.stopPropagation(); handleMoveCategory('right'); }} className="ml-1 text-zinc-400 hover:text-white" title="往後移">
                                                <IconChevronRight />
                                            </button>
                                        )}

                                        <button 
                                            onClick={(e) => { e.stopPropagation(); handleDeleteCategory(category); }}
                                            className={`ml-1.5 p-0.5 rounded hover:bg-rose-500 hover:text-white transition ${isActive ? 'text-zinc-400' : 'text-transparent group-hover:text-zinc-400'}`}
                                            title="刪除此分頁"
                                        >
                                            <IconTrash2 />
                                        </button>
                                    </div>
                                );
                            })}
                            <button onClick={handleAddCategory} className="p-1.5 text-zinc-500 hover:text-zinc-900 hover:bg-zinc-200 rounded-xl transition bg-white border border-zinc-200" title="新增分頁">
                                <IconPlus />
                            </button>
                        </div>

                        {/* 主編輯表格 */}
                        <div className="bg-white rounded-2xl border border-zinc-200/80 shadow-2xs overflow-hidden mb-6">
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs text-left whitespace-nowrap">
                                    <thead className="bg-zinc-50/80 text-zinc-500 font-bold border-b border-zinc-200">
                                        <tr>
                                            <th className="px-2 py-3 w-10 text-center">項次</th>
                                            <th className="px-3 py-3 min-w-[200px]">項目名稱 *</th>
                                            <th className="px-3 py-3 min-w-[120px]">分類</th>
                                            <th className="px-3 py-3 min-w-[120px]">廠商</th>
                                            <th className="px-3 py-3 min-w-[160px]">報價備註</th>
                                            <th className="px-3 py-3 w-24 text-right">數量</th>
                                            <th className="px-3 py-3 w-16 text-center">單位</th>
                                            <th className="px-3 py-3 w-28 text-right text-amber-900">單位成本</th>
                                            <th className="px-3 py-3 w-28 text-right text-zinc-900">單位報價</th>
                                            <th className="px-3 py-3 w-28 text-right">小計報價</th>
                                            <th className="px-3 py-3 w-24 text-center text-emerald-800">毛利率 (%)</th>
                                            <th className="px-3 py-3 w-28 text-center">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-zinc-100">
                                        {groupedActiveItems.map(([catName, itemsInCat], catIdx) => {
                                            const catLetter = String.fromCharCode(65 + catIdx); 
                                            return (
                                                <React.Fragment key={catName}>
                                                    <tr className="bg-zinc-100/60 border-y border-zinc-200/80">
                                                        <td className="px-2 py-1.5 font-bold text-center text-zinc-500">{catLetter}</td>
                                                        <td colSpan="11" className="px-3 py-1.5 font-bold text-zinc-800">
                                                            <input 
                                                                type="text" 
                                                                defaultValue={catName} 
                                                                onBlur={e => handleCategoryNameChange(catName, e.target.value)}
                                                                onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                                                                className="bg-transparent border-b border-transparent hover:border-zinc-300 focus:border-zinc-800 outline-none w-full max-w-xs transition font-bold py-0.5 text-xs"
                                                                title="修改此分類群組名稱"
                                                            />
                                                        </td>
                                                    </tr>
                                                    {itemsInCat.map((item, itemIdx) => (
                                                        <tr key={item.id} className="hover:bg-zinc-50/80 transition">
                                                            <td className="px-2 py-1.5 text-center font-semibold text-zinc-400">{itemIdx + 1}</td>
                                                            
                                                            <td className="px-3 py-1.5">
                                                                <AutoResizeTextarea
                                                                    value={item.name}
                                                                    onChange={e => handleItemChange(item.id, 'name', e.target.value)}
                                                                    placeholder="項目名稱..."
                                                                    className="w-full border border-zinc-200/80 rounded-lg px-2 py-1 focus:border-zinc-800 font-medium text-xs whitespace-pre-wrap bg-white"
                                                                />
                                                            </td>
                                                            <td className="px-3 py-1.5">
                                                                <AutoResizeTextarea
                                                                    value={item.category}
                                                                    onChange={e => handleItemChange(item.id, 'category', e.target.value)}
                                                                    placeholder="分類"
                                                                    className="w-full border border-zinc-200/80 rounded-lg px-2 py-1 focus:border-zinc-800 text-[11px] text-zinc-600 whitespace-pre-wrap bg-white"
                                                                />
                                                            </td>
                                                            <td className="px-3 py-1.5">
                                                                <AutoResizeTextarea
                                                                    value={item.provider}
                                                                    onChange={e => handleItemChange(item.id, 'provider', e.target.value)}
                                                                    placeholder="廠商"
                                                                    className="w-full border border-zinc-200/80 rounded-lg px-2 py-1 focus:border-zinc-800 text-[11px] text-zinc-600 whitespace-pre-wrap bg-white"
                                                                />
                                                            </td>
                                                            <td className="px-3 py-1.5">
                                                                <AutoResizeTextarea
                                                                    value={item.note}
                                                                    onChange={e => handleItemChange(item.id, 'note', e.target.value)}
                                                                    placeholder="規格/尺寸..."
                                                                    className="w-full border border-zinc-200/80 rounded-lg px-2 py-1 focus:border-zinc-800 text-[11px] text-zinc-500 whitespace-pre-wrap bg-white"
                                                                />
                                                            </td>
                                                            
                                                            <td className="px-3 py-1.5"><input type="number" value={item.quantity} onChange={e => handleItemChange(item.id, 'quantity', parseFloat(e.target.value) || 0)} className="w-full text-right border border-zinc-200/80 rounded-lg px-2 py-1 outline-none focus:border-zinc-800 bg-white" min="0" step="0.1" /></td>
                                                            <td className="px-3 py-1.5"><input type="text" value={item.unit} onChange={e => handleItemChange(item.id, 'unit', e.target.value)} className="w-full text-center border border-zinc-200/80 rounded-lg px-1 py-1 outline-none focus:border-zinc-800 bg-white" /></td>
                                                            <td className="px-3 py-1.5"><input type="number" value={item.unitCost} onChange={e => handleItemChange(item.id, 'unitCost', parseFloat(e.target.value) || 0)} className="w-full text-right border border-amber-200/80 bg-amber-50/50 rounded-lg px-2 py-1 outline-none focus:border-amber-800 text-amber-900 font-medium" min="0" step="100" /></td>
                                                            <td className="px-3 py-1.5"><input type="number" value={item.unitPrice} onChange={e => handleItemChange(item.id, 'unitPrice', parseFloat(e.target.value) || 0)} className="w-full text-right border border-zinc-300 bg-white rounded-lg px-2 py-1 outline-none focus:border-zinc-900 text-zinc-900 font-bold" min="0" step="100" /></td>
                                                            <td className="px-3 py-1.5 text-right font-bold text-zinc-800">{formatCurrency(item.quantity * item.unitPrice)}</td>
                                                            
                                                            <td className="px-3 py-1.5">
                                                                <div className="flex items-center justify-end bg-emerald-50/50 rounded-lg border border-emerald-200/80 px-1.5 py-1">
                                                                    <input 
                                                                        type="number"
                                                                        value={item.unitPrice > 0 ? (((item.unitPrice - item.unitCost) / item.unitPrice) * 100).toFixed(1) : ""} 
                                                                        onChange={(e) => handleMarginChange(item.id, e.target.value)}
                                                                        className="w-full text-right bg-transparent outline-none text-emerald-900 font-bold text-xs" 
                                                                        min="0" max="99.9" step="0.1" placeholder="0.0"
                                                                    />
                                                                    <span className="text-emerald-900 font-bold text-[10px] ml-0.5">%</span>
                                                                </div>
                                                            </td>

                                                            <td className="px-3 py-1.5 text-center whitespace-nowrap">
                                                                <div className="flex items-center justify-center gap-1">
                                                                    <button onClick={() => handleInsertItem(item.id, 'above')} className="text-zinc-400 hover:text-emerald-700 p-1 hover:bg-emerald-50 rounded" title="向上插列"><IconInsertAbove /></button>
                                                                    <button onClick={() => handleInsertItem(item.id, 'below')} className="text-zinc-400 hover:text-emerald-700 p-1 hover:bg-emerald-50 rounded" title="向下插列"><IconInsertBelow /></button>
                                                                    <button onClick={() => handleMoveItem(item.id, 'up')} className="text-zinc-400 hover:text-zinc-800 p-1 hover:bg-zinc-100 rounded" title="上移"><IconArrowUp /></button>
                                                                    <button onClick={() => handleMoveItem(item.id, 'down')} className="text-zinc-400 hover:text-zinc-800 p-1 hover:bg-zinc-100 rounded" title="下移"><IconArrowDown /></button>
                                                                    <button onClick={() => handleRemoveItem(item.id)} className="text-zinc-400 hover:text-rose-600 p-1 hover:bg-rose-50 rounded" title="刪除"><IconTrash2 /></button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </React.Fragment>
                                            );
                                        })}
                                        <tr className="bg-zinc-50/50">
                                            <td colSpan="12" className="px-3 py-3">
                                                <button onClick={handleAddItem} className="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-zinc-200 text-zinc-700 hover:text-zinc-900 hover:border-zinc-400 rounded-xl font-bold text-xs transition shadow-2xs">
                                                    <IconPlus /> 新增工項
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                    
                                    <tfoot className="border-t-2 border-zinc-300">
                                        <tr className="bg-amber-50/30 no-print">
                                            <td colSpan="9" className="px-3 py-2 text-right font-bold text-amber-900">本頁成本小計 (不列印)：</td>
                                            <td className="px-3 py-2 text-right font-bold text-amber-900 text-sm">{formatCurrency(activeSheetTotalCost)}</td>
                                            <td colSpan="2"></td>
                                        </tr>
                                        <tr className="bg-white">
                                            <td colSpan="9" className="px-3 py-2 text-right font-bold text-zinc-500">本頁細項小計 (報價)：</td>
                                            <td className="px-3 py-2 text-right font-bold text-zinc-900 text-sm">{formatCurrency(activeSheetTotalPrice)}</td>
                                            <td colSpan="2"></td>
                                        </tr>
                                        {targetBudgets[activeSheet] > 0 && (
                                            <tr className="bg-zinc-50/80">
                                                <td colSpan="9" className="px-3 py-2 text-right font-bold text-zinc-600">預先規劃之目標預算：</td>
                                                <td className="px-3 py-2 text-right font-bold text-zinc-800 text-sm">{formatCurrency(targetBudgets[activeSheet])}</td>
                                                <td colSpan="2" className="px-3 py-2 text-left font-bold text-xs">
                                                    {targetBudgets[activeSheet] >= activeSheetTotalPrice 
                                                        ? <span className="text-emerald-800 bg-emerald-100/80 px-2 py-0.5 rounded-md">🟢 餘額：{formatCurrency(targetBudgets[activeSheet] - activeSheetTotalPrice)}</span>
                                                        : <span className="text-rose-800 bg-rose-100/80 px-2 py-0.5 rounded-md">🔴 超出：{formatCurrency(activeSheetTotalPrice - targetBudgets[activeSheet])}</span>
                                                    }
                                                </td>
                                            </tr>
                                        )}
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                        {/* 🌟 總計與成本儀表板：改為質感灰底與深黑數據呈顯 */}
                        <div className="bg-zinc-200/60 border border-zinc-300 text-zinc-900 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-end gap-6 shadow-2xs mb-8">
                            <div className="w-full md:w-auto space-y-2 text-xs text-zinc-600">
                                <div className="flex justify-between md:w-64">
                                    <span className="font-medium">未稅工程細項總計</span> 
                                    <span className="font-bold text-zinc-800">{formatCurrency(netTotalPrice)}</span>
                                </div>
                                <div className="flex justify-between md:w-64">
                                    <span className="font-medium">工程監管費 ({managementFeeRate}%)</span> 
                                    <span className="font-bold text-zinc-800">{formatCurrency(managementFee)}</span>
                                </div>
                                {designFee > 0 && (
                                    <div className="flex justify-between md:w-64">
                                        <span className="font-medium">設計費</span> 
                                        <span className="font-bold text-zinc-800">{formatCurrency(designFee)}</span>
                                    </div>
                                )}
                                {includeTax && (
                                    <div className="flex justify-between md:w-64">
                                        <span className="font-medium">營業稅 (5%)</span> 
                                        <span className="font-bold text-zinc-800">{formatCurrency(tax)}</span>
                                    </div>
                                )}
                            </div>
                            
                            <div className="w-full md:w-auto text-right border-t border-zinc-300/80 md:border-none pt-4 md:pt-0">
                                <div className="text-zinc-500 text-[10px] font-bold tracking-widest mb-1 uppercase">{includeTax ? '實際含稅總預算金額' : '實際總預算金額'}</div>
                                <div className="text-3xl md:text-4xl font-black text-zinc-900 tracking-tight">{formatCurrency(grossTotal)}</div>
                                <div className="text-xs text-zinc-600 mt-2 font-medium flex items-center justify-end gap-2">
                                    <span className="bg-white/80 border border-zinc-300/60 px-2 py-0.5 rounded-md">總成本 {formatCurrency(totalCost)}</span>
                                    <span className="bg-white/80 border border-zinc-300/60 px-2 py-0.5 rounded-md">總毛利 {formatCurrency(profit)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
