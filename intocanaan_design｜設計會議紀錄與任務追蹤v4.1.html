<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTOCANAAN DESIGN | 雲端硬碟會議追蹤系統</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 載入 Google Identity Services 驗證 SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f9fafb; }
        
        /* 列印專用樣式：隱藏按鈕、去除邊框，優化排版 */
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; padding: 20px; }
            .print-only { display: block !important; }
            .details-row { display: none !important; }
            input[type="text"], input[type="date"] {
                border: none !important;
                background-color: transparent !important;
                padding: 0 !important;
                box-shadow: none !important;
                color: #111827 !important;
            }
            .task-card { page-break-inside: avoid !important; break-inside: avoid !important; }
        }
        .print-only { display: none; }
        .done-line { text-decoration: line-through; opacity: 0.6; }
    </style>
</head>
<body class="p-4 md:p-10 relative">

    <div class="max-w-6xl mx-auto bg-white shadow-sm rounded-lg border border-gray-200 p-8 relative">
        <header class="text-center mb-10 relative">
            <h1 class="text-3xl tracking-[0.2em] font-medium text-gray-900 uppercase">INTOCANAAN DESIGN</h1>
            <div class="w-16 h-[1px] bg-gray-900 mx-auto mt-4 mb-2"></div>
            <p class="text-gray-500 text-sm tracking-[0.1em]">設計會議紀錄與進度追蹤 (Google Drive 版)</p>
            
            <!-- 雲端連線與同步狀態指示器 (優化版) -->
            <div id="driveStatus" class="absolute top-0 right-0 flex items-center text-xs font-bold bg-gray-50 px-3 py-1.5 rounded-full border border-gray-200 no-print transition-colors">
                <button id="authBtn" onclick="window.connectGoogleDrive()" class="text-blue-600 hover:text-blue-800 flex items-center gap-1 transition-colors">
                    <i data-lucide="link" class="w-3.5 h-3.5"></i> 連線 Google 雲端
                </button>
                <div id="driveStatusText" class="hidden items-center gap-1 text-gray-500 pl-1 pr-3"></div>
                <button id="openLibBtn" onclick="window.openCloudLibrary()" class="hidden text-teal-600 hover:text-teal-800 flex items-center gap-1 border-l border-gray-300 pl-3 transition-colors">
                    <i data-lucide="folder-open" class="w-3.5 h-3.5"></i> 專案庫
                </button>
            </div>
        </header>

        <div class="flex flex-wrap justify-end gap-3 mb-6 no-print">
            <!-- 傳統 JSON 備份功能 (雙重保險) -->
            <button onclick="window.exportJSON()" class="bg-slate-500 text-white px-4 py-2 rounded text-sm font-bold hover:bg-slate-600 transition flex items-center gap-2 shadow-sm">
                <i data-lucide="download" class="w-4 h-4"></i> 本機備份
            </button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-teal-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-teal-700 transition flex items-center gap-2 shadow-sm">
                <i data-lucide="upload" class="w-4 h-4"></i> 本機匯入
            </button>
            <input type="file" id="fileInput" class="hidden" onchange="window.importJSON(event)" accept=".json">
            
            <!-- 會議進度管理與匯出 -->
            <button onclick="window.archiveCompleted()" class="bg-amber-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-amber-700 transition flex items-center gap-2 shadow-sm">
                <i data-lucide="archive" class="w-4 h-4"></i> 新會議：封存已完成任務
            </button>
            <button onclick="window.print()" class="bg-gray-900 text-white px-4 py-2 rounded text-sm font-bold hover:bg-black transition flex items-center gap-2 shadow-sm">
                <i data-lucide="file-down" class="w-4 h-4"></i> 匯出 PDF 紀錄
            </button>
        </div>

        <!-- 專案標題區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 p-6 bg-gray-50 rounded-lg border border-gray-100">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">專案名稱</label>
                <input type="text" id="projectName" oninput="window.debouncedSave()" placeholder="請輸入專案名稱" class="w-full border border-gray-200 p-2.5 rounded focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">開會日期</label>
                <input type="date" id="meetingDate" onchange="window.debouncedSave()" class="w-full border border-gray-200 p-2.5 rounded focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none transition">
            </div>
        </div>

        <!-- 決策紀錄輸入區 -->
        <section class="mb-10 bg-white border border-gray-200 p-6 rounded-lg shadow-sm no-print relative">
            <h2 class="text-lg font-bold mb-6 text-gray-800 border-b border-gray-100 pb-3 flex items-center gap-2"><i data-lucide="pencil" class="w-5 h-5 text-amber-600"></i> 設計決策紀錄</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="editId">
                <select id="tags" class="border border-gray-200 p-3 rounded text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none">
                    <option>空間配置</option><option>風格設計</option><option>材料選樣</option>
                    <option>機電設備</option><option>木作細節</option><option>工程施工</option>
                    <option>預算追加減</option><option>工程進度</option><option>業主待確認事項</option>
                </select>
                <select id="resp" class="border border-gray-200 p-3 rounded text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none">
                    <option>設計師</option><option>業主</option><option>工程管理</option>
                    <option>廠商</option><option>待確認</option>
                </select>
                <input type="text" id="subject" placeholder="決策主旨 (必填)" class="border border-gray-200 p-3 rounded text-sm col-span-2 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none">
                <textarea id="desc" placeholder="詳細內容..." class="border border-gray-200 p-3 rounded text-sm col-span-2 h-24 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none"></textarea>
                <input type="date" id="dueDate" class="border border-gray-200 p-3 rounded text-sm col-span-2 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none">
            </div>
            <div class="mt-6">
                <button id="addBtn" onclick="window.addAction()" class="w-full bg-gray-900 text-white py-3 rounded text-sm font-bold hover:bg-black transition shadow">新增設計任務</button>
            </div>
        </section>

        <!-- 看板區塊 -->
        <section class="mb-10">
            <h2 class="text-lg font-bold mb-6 text-gray-800 flex items-center gap-2 border-b border-gray-100 pb-2"><i data-lucide="layout" class="w-5 h-5 text-teal-600"></i> 設計進度看板 </h2>
            <div id="board" class="space-y-6 min-h-[100px]"></div>
        </section>

        <!-- 清單列表區塊 -->
        <section class="no-print">
            <h2 class="text-lg font-bold mb-6 text-gray-800 flex items-center gap-2 border-b border-gray-100 pb-2"><i data-lucide="check-square" class="w-5 h-5 text-indigo-600"></i> 設計追蹤清單</h2>
            <div id="tracker" class="space-y-6 min-h-[100px]"></div>
        </section>
    </div>

    <!-- 雲端專案資料庫視窗 (新增) -->
    <div id="cloudLibraryModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-40 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-md w-full mx-4 flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-5 border-b border-gray-100 pb-3">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="folder-kanban" class="w-5 h-5 text-teal-600"></i> 雲端專案資料庫</h3>
                <button onclick="window.closeCloudLibrary()" class="text-gray-400 hover:text-gray-800 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="mb-5 flex gap-2">
                <input type="text" id="newCloudProjectName" placeholder="輸入新專案名稱..." class="flex-1 border border-gray-200 p-2.5 rounded text-sm focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none">
                <button onclick="window.createNewCloudProject()" class="bg-teal-600 text-white px-4 py-2.5 rounded text-sm font-bold hover:bg-teal-700 transition shadow-sm whitespace-nowrap flex items-center gap-1">
                    <i data-lucide="folder-plus" class="w-4 h-4"></i> 新建專案
                </button>
            </div>
            <div class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">現有雲端專案 (Google Drive)</div>
            <div id="cloudProjectList" class="flex-1 overflow-y-auto space-y-2 pr-2 border border-gray-100 bg-gray-50 p-2 rounded">
                <!-- JS 渲染專案列表 -->
            </div>
        </div>
    </div>

    <!-- 客製化彈出視窗 -->
    <div id="customModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full mx-4 transform transition-all">
            <div class="flex items-center gap-3 mb-4">
                <div id="modalIconBox" class="bg-amber-100 p-2 rounded-full text-amber-600">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                </div>
                <h3 id="modalTitle" class="text-lg font-bold text-gray-800">提示</h3>
            </div>
            <p id="modalText" class="text-sm text-gray-600 mb-8 whitespace-pre-wrap leading-relaxed"></p>
            <div class="flex justify-end gap-3">
                <button id="modalCancelBtn" class="px-4 py-2.5 bg-gray-100 text-gray-700 rounded-lg text-sm font-bold hidden hover:bg-gray-200 transition">取消</button>
                <button id="modalConfirmBtn" class="px-5 py-2.5 bg-gray-900 text-white rounded-lg text-sm font-bold hover:bg-black transition shadow-md">確定</button>
            </div>
        </div>
    </div>

    <script>
        // ======= 請在此處填入您申請到的 Google Client ID =======
        const CLIENT_ID = '481052743814-3u3vutlbv3mdhacu1gof1tc48to5s9r8.apps.googleusercontent.com';
        // =====================================================

        let tasks = [];
        let tokenClient;
        let accessToken = null;
        let driveFileId = null; // 當前編輯的雲端檔案 ID
        let saveTimeout = null;

        // 客製化視窗的回呼函數暫存
        let modalConfirmCb = null;
        let modalCancelCb = null;

        // 啟動客製化視窗函數
        window.showModal = function(text, type = 'alert', onConfirm = null, onCancel = null) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalText').innerText = text;
            
            const cancelBtn = document.getElementById('modalCancelBtn');
            const iconBox = document.getElementById('modalIconBox');
            
            if (type === 'confirm') {
                cancelBtn.classList.remove('hidden');
                document.getElementById('modalTitle').innerText = '請確認';
                iconBox.innerHTML = '<i data-lucide="help-circle" class="w-5 h-5"></i>';
                iconBox.className = 'bg-blue-100 p-2 rounded-full text-blue-600';
            } else {
                cancelBtn.classList.add('hidden');
                document.getElementById('modalTitle').innerText = '系統提示';
                iconBox.innerHTML = '<i data-lucide="info" class="w-5 h-5"></i>';
                iconBox.className = 'bg-amber-100 p-2 rounded-full text-amber-600';
            }
            
            lucide.createIcons();
            modalConfirmCb = onConfirm;
            modalCancelCb = onCancel;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        // 綁定視窗按鈕事件
        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            document.getElementById('customModal').classList.add('hidden');
            document.getElementById('customModal').classList.remove('flex');
            if (modalConfirmCb) modalConfirmCb();
        });

        document.getElementById('modalCancelBtn').addEventListener('click', () => {
            document.getElementById('customModal').classList.add('hidden');
            document.getElementById('customModal').classList.remove('flex');
            if (modalCancelCb) modalCancelCb();
        });

        // 初始化 Google OAuth 客戶端
        function initGIS() {
            if (CLIENT_ID.includes('請替換成') || CLIENT_ID.includes('您的_CLIENT_ID')) {
                console.warn("未設定 CLIENT_ID，將以純本地模式運行。");
                return;
            }
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.file',
                callback: async (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        updateDriveStatusUI('connected');
                        window.openCloudLibrary(); // 登入成功後直接開啟專案庫
                    }
                },
            });
        }
        window.addEventListener('load', initGIS);

        // 觸發授權彈窗
        window.connectGoogleDrive = function() {
            if (!tokenClient) {
                window.showModal("尚未載入 Google SDK，或您未設定正確的 Client ID。目前將以本地模式運行。");
                return;
            }
            tokenClient.requestAccessToken({ prompt: 'consent' });
        };

        // UI 狀態切換
        function updateDriveStatusUI(status) {
            const authBtn = document.getElementById('authBtn');
            const statusText = document.getElementById('driveStatusText');
            const openLibBtn = document.getElementById('openLibBtn');
            
            if (status === 'connecting') {
                authBtn.classList.add('hidden');
                statusText.classList.remove('hidden');
                statusText.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> 處理中...`;
                openLibBtn.classList.add('hidden');
            } else if (status === 'connected') {
                authBtn.classList.add('hidden');
                statusText.classList.remove('hidden');
                statusText.classList.remove('text-amber-600', 'text-red-600');
                statusText.classList.add('text-green-600');
                statusText.innerHTML = `<i data-lucide="cloud-check" class="w-3.5 h-3.5"></i> 已連線同步`;
                openLibBtn.classList.remove('hidden');
                openLibBtn.classList.add('flex');
            } else if (status === 'saving') {
                statusText.classList.remove('text-green-600', 'text-red-600');
                statusText.classList.add('text-amber-600');
                statusText.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5 animate-spin"></i> 自動儲存中...`;
            } else if (status === 'error') {
                statusText.classList.remove('text-green-600', 'text-amber-600');
                statusText.classList.add('text-red-600');
                statusText.innerHTML = `<i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> 同步失敗`;
            }
            lucide.createIcons();
        }

        // ================= 新增：雲端檔案資料庫邏輯 =================

        window.openCloudLibrary = async function() {
            if (!accessToken) {
                window.connectGoogleDrive();
                return;
            }
            document.getElementById('cloudLibraryModal').classList.remove('hidden');
            document.getElementById('cloudLibraryModal').classList.add('flex');
            document.getElementById('cloudProjectList').innerHTML = '<div class="text-sm text-gray-500 text-center py-6 flex flex-col items-center gap-2"><i data-lucide="loader-2" class="w-5 h-5 animate-spin text-teal-500"></i> 搜尋專案中...</div>';
            lucide.createIcons();

            try {
                // 搜尋檔名包含 [INTOCANAAN] 的 JSON 檔案
                const query = encodeURIComponent("name contains '[INTOCANAAN]' and mimeType='application/json' and trashed=false");
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await res.json();
                
                if (data.files && data.files.length > 0) {
                    document.getElementById('cloudProjectList').innerHTML = data.files.map(f => {
                        const dateObj = new Date(f.modifiedTime);
                        const dateStr = `${dateObj.getFullYear()}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${String(dateObj.getDate()).padStart(2,'0')} ${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`;
                        const pName = f.name.replace('[INTOCANAAN] ', '').replace('.json', '');
                        
                        return `
                            <div class="flex items-center justify-between p-3 border border-gray-200 rounded-lg hover:border-teal-500 hover:bg-teal-50/30 transition cursor-pointer bg-white shadow-sm" onclick="window.loadFromCloud('${f.id}')">
                                <div>
                                    <div class="font-bold text-gray-800 text-sm tracking-wider flex items-center gap-1.5"><i data-lucide="file-json" class="w-4 h-4 text-gray-400"></i> ${pName}</div>
                                    <div class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest pl-5">最後更新: ${dateStr}</div>
                                </div>
                                <button class="text-teal-600 font-bold text-xs bg-white border border-teal-200 px-3 py-1.5 rounded hover:bg-teal-600 hover:text-white transition">載入專案</button>
                            </div>
                        `;
                    }).join('');
                } else {
                    document.getElementById('cloudProjectList').innerHTML = '<div class="text-sm text-gray-400 text-center py-6 border border-dashed border-gray-200 rounded bg-white">目前雲端還沒有建立過專案。</div>';
                }
                lucide.createIcons();
            } catch (err) {
                console.error(err);
                document.getElementById('cloudProjectList').innerHTML = '<div class="text-sm text-red-500 text-center py-6 border border-red-100 bg-red-50 rounded">讀取失敗，請確認權限或網路連線。</div>';
            }
        };

        window.closeCloudLibrary = function() {
            document.getElementById('cloudLibraryModal').classList.add('hidden');
            document.getElementById('cloudLibraryModal').classList.remove('flex');
        };

        // 載入指定的雲端專案
        window.loadFromCloud = async function(id) {
            driveFileId = id;
            updateDriveStatusUI('connecting');
            window.closeCloudLibrary();
            try {
                const downloadUrl = `https://www.googleapis.com/drive/v3/files/${id}?alt=media`;
                const response = await fetch(downloadUrl, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                const cloudData = await response.json();
                
                document.getElementById('projectName').value = cloudData.projectName || '';
                document.getElementById('meetingDate').value = cloudData.meetingDate || '';
                tasks = cloudData.tasks || [];
                updateView();
                updateDriveStatusUI('connected');
                window.showModal("🎉 雲端專案已成功載入！");
            } catch (err) {
                console.error(err);
                updateDriveStatusUI('error');
                window.showModal("載入專案失敗，請稍後再試。");
            }
        };

        // 建立全新的雲端專案
        window.createNewCloudProject = async function() {
            const nameInput = document.getElementById('newCloudProjectName').value.trim();
            if(!nameInput) {
                window.showModal("請輸入要建立的新專案名稱。");
                return;
            }
            
            const fileName = `[INTOCANAAN] ${nameInput}.json`;
            const metadata = { name: fileName, mimeType: 'application/json' };
            const initialData = { projectName: nameInput, meetingDate: new Date().toISOString().slice(0, 10), tasks: [] };
            
            const boundary = '-------314159265358979323846';
            const delimiter = "\r\n--" + boundary + "\r\n";
            const close_delim = "\r\n--" + boundary + "--";
            
            const multipartRequestBody =
                delimiter +
                'Content-Type: application/json\r\n\r\n' +
                JSON.stringify(metadata) +
                delimiter +
                'Content-Type: application/json\r\n\r\n' +
                JSON.stringify(initialData) +
                close_delim;
            
            document.getElementById('cloudProjectList').innerHTML = '<div class="text-sm text-teal-600 text-center py-6 flex flex-col items-center gap-2"><i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 正在建立雲端檔案...</div>';
            lucide.createIcons();
            
            try {
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'multipart/related; boundary=' + boundary
                    },
                    body: multipartRequestBody
                });
                const file = await response.json();
                driveFileId = file.id;
                
                // 套用到畫面
                document.getElementById('projectName').value = nameInput;
                document.getElementById('meetingDate').value = initialData.meetingDate;
                document.getElementById('newCloudProjectName').value = '';
                tasks = [];
                updateView();
                window.closeCloudLibrary();
                updateDriveStatusUI('connected');
                window.showModal(`已成功建立專屬雲端專案檔案：\n「${nameInput}」\n現在您可以開始紀錄進度了！`);
            } catch (err) {
                console.error(err);
                window.showModal("建立專案失敗，請檢查權限。");
                window.closeCloudLibrary();
            }
        };

        // 防抖動存檔 (停止操作 1.5 秒後才寫入雲端)
        window.debouncedSave = function() {
            if (!accessToken || !driveFileId) return; 
            updateDriveStatusUI('saving');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveToCloudImmediate, 1500);
        };

        // 寫入當前選定的雲端檔案，並同步更新雲端檔名
        async function saveToCloudImmediate() {
            if (!accessToken || !driveFileId) return;
            
            const currentProjName = document.getElementById('projectName').value || '未命名專案';
            const dataToSave = {
                projectName: currentProjName,
                meetingDate: document.getElementById('meetingDate').value,
                tasks: tasks
            };

            try {
                // 1. 更新檔案內容
                await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSave)
                });
                
                // 2. 同步更新 Google Drive 上的檔案名稱，確保專案庫好辨識
                await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: `[INTOCANAAN] ${currentProjName}.json` })
                });

                updateDriveStatusUI('connected');
            } catch (err) {
                console.error(err);
                updateDriveStatusUI('error');
            }
        }

        // ================= 原有系統核心邏輯 (保持不變) =================

        window.addAction = function() {
            const subject = document.getElementById('subject').value;
            const editId = document.getElementById('editId').value;
            const dueDate = document.getElementById('dueDate').value;
            
            if(!subject || !dueDate) {
                window.showModal("請填寫主旨與截止日期。");
                return;
            }
            
            if(editId) {
                const index = tasks.findIndex(t => t.id == editId);
                tasks[index] = { ...tasks[index], subject, desc: document.getElementById('desc').value, tag: document.getElementById('tags').value, resp: document.getElementById('resp').value, dueDate: dueDate };
                document.getElementById('editId').value = '';
                document.getElementById('addBtn').innerText = '新增設計任務';
            } else {
                tasks.push({
                    id: Date.now(),
                    subject,
                    desc: document.getElementById('desc').value,
                    tag: document.getElementById('tags').value,
                    resp: document.getElementById('resp').value,
                    dueDate: dueDate,
                    subtasks: { '設計圖修改': false, '模擬圖修改': false, '預算書修改': false },
                    status: '進行中',
                    isDeleted: false,
                    remark: ''
                });
            }
            document.getElementById('subject').value = '';
            document.getElementById('desc').value = '';
            updateView();
            window.debouncedSave();
        };

        window.updateRemark = function(id, value) {
            const task = tasks.find(t => t.id === id);
            if(task) {
                task.remark = value;
                window.debouncedSave();
            }
        };

        window.editTask = function(id) {
            const t = tasks.find(t => t.id === id);
            document.getElementById('editId').value = t.id;
            document.getElementById('subject').value = t.subject;
            document.getElementById('desc').value = t.desc;
            document.getElementById('tags').value = t.tag;
            document.getElementById('resp').value = t.resp;
            document.getElementById('dueDate').value = t.dueDate;
            document.getElementById('addBtn').innerText = '更新設計任務';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.toggleDelete = function(id) {
            const task = tasks.find(t => t.id === id);
            if(task) {
                window.showModal(`確定要刪除任務「${task.subject}」嗎？`, 'confirm', () => {
                    task.isDeleted = true;
                    updateView();
                    window.debouncedSave();
                });
            }
        };

        window.updateSubtask = function(taskId, subKey) {
            const task = tasks.find(t => t.id === taskId);
            if(task) {
                task.subtasks[subKey] = !task.subtasks[subKey];
                const allDone = Object.values(task.subtasks).every(v => v === true);
                task.status = allDone ? '已完成' : '進行中';
                updateView();
                window.debouncedSave();
            }
        };

        window.archiveCompleted = function() {
            const completedTasks = tasks.filter(t => !t.isDeleted && t.status === '已完成');
            if (completedTasks.length === 0) {
                window.showModal("目前沒有已完成的任務可以封存。");
                return;
            }
            
            window.showModal(`準備開啟新會議？\n\n這會將目前畫面上 ${completedTasks.length} 筆「已完成」的任務封存隱藏，只保留未完成的項目。\n確認執行嗎？`, 'confirm', () => {
                completedTasks.forEach(t => t.isDeleted = true);
                window.showModal("封存成功！您可以更新上方「開會日期」開始新紀錄了。");
                updateView();
                window.debouncedSave();
            });
        };

        window.toggleDetails = function(id) { 
            const el = document.getElementById('details-' + id);
            if (el) el.classList.toggle('hidden'); 
        };

        // 本地備份匯出 JSON
        window.exportJSON = function() {
            const dataToSave = {
                projectName: document.getElementById('projectName').value,
                meetingDate: document.getElementById('meetingDate').value,
                tasks: tasks.filter(t => !t.isDeleted)
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToSave));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            const dateStr = document.getElementById('meetingDate').value || new Date().toISOString().slice(0, 10);
            dl.setAttribute("download", `設計會議備份_${dateStr}.json`);
            dl.click();
        };

        // 本地匯入 JSON
        window.importJSON = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if(!Array.isArray(importedData)) {
                        if(importedData.projectName && !document.getElementById('projectName').value) {
                            document.getElementById('projectName').value = importedData.projectName;
                        }
                    }

                    window.showModal(
                        "是否僅匯入舊檔中「未完成」的任務？\n\n[確定]：過濾已完成，僅合併未完成進度\n[取消]：合併舊檔中的所有任務", 
                        'confirm', 
                        () => processImport(importedData, true),  // onConfirm
                        () => processImport(importedData, false)  // onCancel
                    );

                } catch (error) {
                    window.showModal("匯入失敗，請確認檔案格式是否正確。");
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        };

        function processImport(importedData, onlyUncompleted) {
            let importedTasks = Array.isArray(importedData) ? importedData : (importedData.tasks || []);
            
            if (onlyUncompleted) {
                importedTasks = importedTasks.filter(t => t.status !== '已完成');
            }

            importedTasks.forEach(newTask => {
                while (tasks.some(t => t.id === newTask.id)) {
                    newTask.id = Date.now() + Math.floor(Math.random() * 10000);
                }
                newTask.isDeleted = false;
                tasks.push(newTask);
            });

            updateView();
            window.showModal(`本地檔案合併成功！共追加了 ${importedTasks.length} 筆任務。`);
            window.debouncedSave();
        }

        // 畫面渲染邏輯
        function updateView() {
            const board = document.getElementById('board');
            const activeTasks = tasks.filter(t => !t.isDeleted);
            
            const groups = activeTasks.reduce((acc, t) => {
                (acc[t.tag] = acc[t.tag] || []).push(t);
                return acc;
            }, {});
            
            if(activeTasks.length === 0) {
                board.innerHTML = `<p class="text-gray-400 text-sm text-center py-10 w-full bg-gray-50 rounded border border-dashed border-gray-200">目前沒有進度看板任務。</p>`;
            } else {
                board.innerHTML = Object.entries(groups).map(([tag, list]) => `
                    <div>
                        <h3 class="text-sm font-bold text-amber-600 mb-3 border-b border-gray-100 pb-1">${tag}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${list.map(t => `
                                <div class="task-card p-4 border rounded-lg shadow-sm bg-white relative transition-all ${t.status === '已完成' ? 'border-green-300 bg-green-50/20' : 'border-gray-200'}">
                                    ${t.status === '已完成' ? '<div class="absolute top-2 right-2 text-green-500"><i data-lucide="check-circle" class="w-5 h-5"></i></div>' : ''}
                                    <p class="text-base font-bold text-gray-800 mb-1 pr-6">${t.subject}</p>
                                    <p class="text-sm text-gray-600 italic mb-3 leading-relaxed">${t.desc}</p>
                                    <p class="text-[11px] font-medium text-gray-500 border-t border-gray-100 pt-2">${t.resp} | 截止: ${t.dueDate}</p>
                                    <div class="mt-3">
                                        <input type="text" placeholder="輸入處理進度與備註..." value="${t.remark || ''}" onchange="window.updateRemark(${t.id}, this.value)" class="w-full text-xs p-2 border border-gray-200 rounded text-gray-700 bg-gray-50 focus:outline-none focus:bg-white focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all no-print">
                                        <p class="text-xs text-gray-800 print-only whitespace-pre-wrap mt-1">${t.remark || ''}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }

            const tracker = document.getElementById('tracker');
            const sortedByDate = [...activeTasks].sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
            const respGroups = sortedByDate.reduce((acc, t) => {
                (acc[t.resp] = acc[t.resp] || []).push(t);
                return acc;
            }, {});
            
            if(activeTasks.length === 0) {
                tracker.innerHTML = '';
            } else {
                tracker.innerHTML = Object.entries(respGroups).map(([resp, list]) => `
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm mb-5">
                        <h3 class="text-sm font-bold text-white bg-gray-800 px-4 py-2.5">${resp}</h3>
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 text-xs uppercase text-gray-500 border-b border-gray-200">
                                <tr><th class="p-3">任務</th><th class="p-3 w-28">截止日</th><th class="p-3 w-24 text-center">進度</th></tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${list.map(t => `
                                    <tr class="cursor-pointer hover:bg-gray-50 transition-colors group" onclick="window.toggleDetails(${t.id})">
                                        <td class="p-3 text-sm font-medium flex gap-3 items-center">
                                            <button class="text-gray-300 hover:text-red-500 transition-colors" onclick="event.stopPropagation(); window.toggleDelete(${t.id})" title="刪除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                            <button class="text-gray-300 hover:text-blue-500 transition-colors" onclick="event.stopPropagation(); window.editTask(${t.id})" title="編輯"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                            <span class="${t.status === '已完成' ? 'done-line text-gray-400' : 'text-gray-800'}">${t.subject}</span>
                                        </td>
                                        <td class="p-3 text-xs text-gray-500">${t.dueDate}</td>
                                        <td class="p-3 text-xs font-bold text-center ${t.status === '已完成' ? 'text-green-600 bg-green-50 rounded' : 'text-amber-600 bg-amber-50 rounded'}">${t.status}</td>
                                    </tr>
                                    <tr id="details-${t.id}" class="hidden details-row bg-gray-50 border-b border-gray-100">
                                        <td colspan="3" class="p-4 pl-12 border-l-4 border-amber-400">
                                            <p class="text-xs text-gray-600 mb-3 leading-relaxed whitespace-pre-wrap">${t.desc}</p>
                                            <div class="flex flex-wrap gap-4 bg-white p-2 border border-gray-200 rounded inline-flex shadow-sm">
                                                ${Object.entries(t.subtasks).map(([key, val]) => `
                                                    <label class="flex items-center text-xs font-medium cursor-pointer hover:text-amber-600 text-gray-700">
                                                        <input type="checkbox" ${val ? 'checked' : ''} onchange="window.updateSubtask(${t.id}, '${key}')" class="mr-1.5 w-3.5 h-3.5 accent-amber-600"> ${key}
                                                    </label>
                                                `).join('')}
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        // 初始渲染圖標與畫面
        lucide.createIcons();
        updateView();
    </script>
</body>
</html>
