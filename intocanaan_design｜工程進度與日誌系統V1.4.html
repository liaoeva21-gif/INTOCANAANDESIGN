<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTOCANAAN DESIGN | 工程雲端進度與日誌系統</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>

    <!-- HTML2PDF 引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Google Identity Services (用於 Google Drive 登入與授權) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Helvetica Neue', 'Noto Sans TC', Arial, sans-serif; background-color: #ffffff; color: #111827; }
        .monochrome-border { border: 1px solid #e5e7eb; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f9fafb; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        .dot-indicator { height: 6px; width: 6px; border-radius: 50%; display: inline-block; margin: 0 2px; }
        
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 🟢 請在此處填寫您的 Google Client ID (申請自 Google Cloud Console)
        const GOOGLE_CLIENT_ID = "481052743814-3u3vutlbv3mdhacu1gof1tc48to5s9r8.apps.googleusercontent.com"; 

        // --- Firebase 初始化 (維持原有) ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        let app, auth, db;
        try {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth().getAuth(app);
            db = firebase.firestore().getFirestore(app);
        } catch (e) {
            console.warn("Firebase config not found. Running in local mode.");
        }
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- SVG 圖示組件 ---
        const IconBase = ({ children, className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>;
        const CalendarIcon = ({className}) => <IconBase className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>;
        const ClipboardList = ({className}) => <IconBase className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></IconBase>;
        const Camera = ({className}) => <IconBase className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconBase>;
        const AlertTriangle = ({className}) => <IconBase className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></IconBase>;
        const TrendingUp = ({className}) => <IconBase className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></IconBase>;
        const CheckCircle = ({className}) => <IconBase className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;
        const Cloud = ({className}) => <IconBase className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></IconBase>;
        const SaveIcon = ({className}) => <IconBase className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>;
        const UploadIcon = ({className}) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></IconBase>;
        const DownloadIcon = ({className}) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconBase>;
        const Printer = ({className}) => <IconBase className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></IconBase>;
        const Plus = ({className}) => <IconBase className={className}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></IconBase>;
        const Trash2 = ({className}) => <IconBase className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>;
        const XIcon = ({className}) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
        const GoogleDriveIcon = ({className}) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8.01953 16.666L11.7505 23.333H23.5186L19.7876 16.666H8.01953Z" fill="#2684FC"/>
                <path d="M15.4981 4.00003L19.229 10.667L13.3446 20.856L9.61365 14.189L15.4981 4.00003Z" fill="#00AA5A"/>
                <path d="M7.48002 4.00003L0.260742 16.667L4.08323 23.334L11.2033 10.667L7.48002 4.00003Z" fill="#FFC107"/>
            </svg>
        );

        // 圖片壓縮函數 (確保能存入 Firebase/Drive)
        const compressImage = (file, maxWidth = 1000) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(maxWidth / img.width, 1);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        function App() {
            // --- 狀態管理 ---
            const [user, setUser] = useState(null);
            const [isCloudSyncing, setIsCloudSyncing] = useState(false);
            
            const [projectName, setProjectName] = useState('未命名專案');
            const [activeTab, setActiveTab] = useState('schedule');
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            
            const [tasks, setTasks] = useState([]);
            const [logs, setLogs] = useState([]);
            
            const [toast, setToast] = useState(null);
            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            const [reportModalOpen, setReportModalOpen] = useState(false);
            const fileInputRefJSON = useRef(null);

            // --- Google Drive 狀態與邏輯 ---
            const [driveToken, setDriveToken] = useState(null);
            const [driveFileList, setDriveFileList] = useState([]);
            const [isDriveModalOpen, setIsDriveModalOpen] = useState(false);

            const loginToDrive = () => {
                if (GOOGLE_CLIENT_ID === "YOUR_GOOGLE_CLIENT_ID") {
                    setDriveToken("mock_token");
                    showToast("✅ [模擬模式] Google 雲端登入成功！(請於源碼填入 Client ID 啟用真實連線)");
                    return;
                }
                const client = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.file',
                    callback: (response) => {
                        if (response.error !== undefined) throw response;
                        setDriveToken(response.access_token);
                        showToast("✅ Google 雲端硬碟登入成功！");
                    }
                });
                client.requestAccessToken();
            };

            const saveToGoogleDrive = async () => {
                if (!driveToken) return loginToDrive();
                setIsCloudSyncing(true);

                // 模擬模式
                if (driveToken === "mock_token") {
                    setTimeout(() => {
                        showToast(`✅ [模擬模式] 專案已備份至 Google Drive (${projectName})`);
                        setIsCloudSyncing(false);
                    }, 1000);
                    return;
                }

                // 真實上傳邏輯
                try {
                    const metadata = { name: `${projectName}_備份.json`, mimeType: 'application/json' };
                    const fileContent = JSON.stringify({ projectName, tasks, logs });
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', new Blob([fileContent], { type: 'application/json' }));

                    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                        method: 'POST',
                        headers: { Authorization: `Bearer ${driveToken}` },
                        body: form
                    });
                    if (res.ok) showToast("✅ 已成功備份至 Google Drive");
                    else throw new Error("Upload failed");
                } catch(e) {
                    console.error(e);
                    showToast("❌ Google Drive 儲存失敗");
                }
                setIsCloudSyncing(false);
            };

            const fetchDriveFiles = async () => {
                if (!driveToken) { showToast("請先點擊上方「Google 雲端登入」"); return; }
                
                // 模擬模式
                if (driveToken === "mock_token") {
                    setDriveFileList([
                        { id: 'mock1', name: `${projectName || 'INTOCANAAN'}_雲端備份.json`, modifiedTime: new Date().toISOString() },
                        { id: 'mock2', name: `舊版專案_歷史備份.json`, modifiedTime: new Date(Date.now() - 86400000).toISOString() }
                    ]);
                    setIsDriveModalOpen(true);
                    return;
                }

                // 真實讀取邏輯
                try {
                    showToast("⏳ 讀取雲端專案庫中...");
                    const res = await fetch("https://www.googleapis.com/drive/v3/files?q=mimeType='application/json' and trashed=false&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc", {
                        headers: { Authorization: `Bearer ${driveToken}` }
                    });
                    const data = await res.json();
                    setDriveFileList(data.files || []);
                    setIsDriveModalOpen(true);
                } catch(e) {
                    console.error(e);
                    showToast("❌ 無法讀取 Google Drive 列表");
                }
            };

            const loadFromDrive = async (fileId) => {
                // 模擬模式
                if (driveToken === "mock_token") {
                    showToast("✅ [模擬模式] 已成功載入 Google Drive 專案");
                    setIsDriveModalOpen(false);
                    return;
                }

                // 真實下載邏輯
                try {
                    showToast("⏳ 正在載入...");
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                        headers: { Authorization: `Bearer ${driveToken}` }
                    });
                    const data = await res.json();
                    if (data.projectName) setProjectName(data.projectName);
                    if (data.tasks) setTasks(data.tasks);
                    if (data.logs) setLogs(data.logs);
                    showToast("✅ 已成功從 Google Drive 載入專案");
                    setIsDriveModalOpen(false);
                } catch(e) {
                    console.error(e);
                    showToast("❌ 載入失敗或檔案格式錯誤");
                }
            };

            // --- 本機 JSON 匯出與匯入邏輯 ---
            const exportLocalJSON = () => {
                const data = { projectName, tasks, logs };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${projectName || '專案'}_備份_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast("✅ 已匯出本機 JSON 備份");
            };

            const importLocalJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.projectName) setProjectName(data.projectName);
                        if (data.tasks) setTasks(data.tasks);
                        if (data.logs) setLogs(data.logs);
                        showToast("✅ 成功載入本機備份");
                    } catch (err) {
                        alert("檔案格式錯誤");
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // --- 日曆邏輯 ---
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const getDaysInMonth = (date) => new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            const getFirstDayOfMonth = (date) => new Date(date.getFullYear(), date.getMonth(), 1).getDay();
            const nextMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1));
            const prevMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1));

            const overallProgress = useMemo(() => {
                if (tasks.length === 0) return 0;
                const total = tasks.reduce((sum, task) => sum + parseInt(task.progress || 0), 0);
                return Math.round(total / tasks.length);
            }, [tasks]);

            // --- 模組 A: 進度管理 ---
            const [newTask, setNewTask] = useState({ name: '', startDate: selectedDate, endDate: selectedDate });
            
            const handleAddTask = () => {
                if (!newTask.name) return showToast("請輸入工項名稱");
                if (newTask.startDate > newTask.endDate) return showToast("開始日期不能晚於結束日期");
                const task = { id: Date.now().toString(), ...newTask, progress: 0, isCompleted: false };
                setTasks([...tasks, task].sort((a, b) => new Date(a.startDate) - new Date(b.startDate)));
                setNewTask({ name: '', startDate: selectedDate, endDate: selectedDate });
            };

            const toggleTaskComplete = (taskId) => {
                setTasks(tasks.map(t => t.id === taskId ? { ...t, isCompleted: !t.isCompleted, progress: !t.isCompleted ? 100 : (t.progress===100?0:t.progress) } : t));
            };
            const updateTaskProgress = (taskId, progress) => {
                setTasks(tasks.map(t => t.id === taskId ? { ...t, progress: parseInt(progress), isCompleted: parseInt(progress) === 100 } : t));
            };
            const deleteTask = (taskId) => {
                if (confirm("確定要刪除此工項嗎？")) setTasks(tasks.filter(t => t.id !== taskId));
            };

            // --- 模組 B: 施工日誌 ---
            const currentLog = useMemo(() => logs.find(l => l.date === selectedDate), [logs, selectedDate]);
            const [logForm, setLogForm] = useState({ weather: '晴天', workers: [], content: '', issues: '', photos: [] });
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (currentLog) setLogForm(currentLog);
                else setLogForm({ weather: '晴天', workers: [{ trade: '', count: 1 }], content: '', issues: '', photos: [] });
            }, [selectedDate, currentLog]);

            const handlePhotoUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                showToast("正在處理圖片，請稍候...");
                const newPhotos = [];
                for (const file of files) {
                    const base64Data = await compressImage(file);
                    newPhotos.push({ id: Date.now() + Math.random(), url: base64Data, name: file.name });
                }
                setLogForm(prev => ({ ...prev, photos: [...prev.photos, ...newPhotos] }));
            };

            const handleSaveLog = () => {
                const cleanWorkers = logForm.workers.filter(w => w.trade.trim() !== '');
                const finalLog = { ...logForm, id: currentLog ? currentLog.id : Date.now().toString(), date: selectedDate, workers: cleanWorkers };
                
                if (currentLog) setLogs(logs.map(l => l.date === selectedDate ? finalLog : l));
                else setLogs([...logs, finalLog].sort((a, b) => new Date(b.date) - new Date(a.date)));
                showToast("✅ 施工日誌已暫存，請記得點擊「Drive 備份」");
            };

            // --- PDF 匯出邏輯 (單日與週報) ---
            const exportPDF = (elementId, filename) => {
                const element = document.getElementById(elementId);
                const opt = {
                    margin:       10,
                    filename:     filename,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            };

            // 產生過去 7 天的報告資料
            const generateWeeklyReportData = () => {
                const end = new Date(selectedDate);
                const start = new Date(selectedDate);
                start.setDate(start.getDate() - 6);
                
                const startStr = start.toISOString().split('T')[0];
                const endStr = end.toISOString().split('T')[0];
                
                const weeklyLogs = logs.filter(l => l.date >= startStr && l.date <= endStr).sort((a, b) => new Date(b.date) - new Date(a.date));
                const activeTasks = tasks.filter(t => t.startDate <= endStr && t.endDate >= startStr);
                
                return { startStr, endStr, weeklyLogs, activeTasks };
            };

            // 渲染日曆
            const renderCalendar = () => {
                const year = currentMonth.getFullYear();
                const month = currentMonth.getMonth();
                const daysInMonth = getDaysInMonth(currentMonth);
                const firstDay = getFirstDayOfMonth(currentMonth);
                const days = [];
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];

                for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} className="p-2 border border-gray-100 bg-gray-50 opacity-50"></div>);

                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const isSelected = dateStr === selectedDate;
                    const hasTask = tasks.some(t => dateStr >= t.startDate && dateStr <= t.endDate);
                    const hasLog = logs.some(l => l.date === dateStr);

                    days.push(
                        <div key={d} onClick={() => setSelectedDate(dateStr)} className={`min-h-[80px] p-2 border monochrome-border cursor-pointer transition-all flex flex-col items-center justify-start relative ${isSelected ? 'bg-gray-100' : 'bg-white hover:bg-gray-50'}`}>
                            <span className={`font-medium w-7 h-7 flex items-center justify-center rounded-full mb-1 ${isSelected ? 'bg-black text-white' : 'text-gray-700'}`}>{d}</span>
                            <div className="flex gap-1 mt-1">
                                {hasTask && <span className="dot-indicator bg-gray-400" title="有施工進度"></span>}
                                {hasLog && <span className="dot-indicator bg-black" title="有施工日誌"></span>}
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="bg-white monochrome-border overflow-hidden">
                        <div className="flex justify-between items-center p-4 border-b monochrome-border bg-white text-black">
                            <button onClick={prevMonth} className="p-1 hover:bg-gray-100 rounded transition font-bold">&lt;</button>
                            <h2 className="font-light text-lg tracking-[0.2em]">{year} 年 {month + 1} 月</h2>
                            <button onClick={nextMonth} className="p-1 hover:bg-gray-100 rounded transition font-bold">&gt;</button>
                        </div>
                        <div className="grid grid-cols-7 text-center bg-gray-50 border-b monochrome-border">
                            {weekdays.map(d => <div key={d} className="py-2 text-xs uppercase tracking-widest text-gray-500">{d}</div>)}
                        </div>
                        <div className="grid grid-cols-7 gap-px bg-gray-200">{days}</div>
                        <div className="p-3 bg-white text-xs text-gray-500 flex gap-4 border-t monochrome-border justify-center">
                            <span className="flex items-center"><span className="dot-indicator bg-gray-400 mr-1"></span> 排定工項</span>
                            <span className="flex items-center"><span className="dot-indicator bg-black mr-1"></span> 施工日誌</span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen relative pb-20 bg-white">
                    
                    {/* 極簡黑白風格 Header (含 Google Drive 登入) */}
                    <header className="pt-8 pb-4 text-center relative max-w-7xl mx-auto px-4">
                        <div className="absolute top-4 right-4 flex gap-3 items-center">
                            {!driveToken ? (
                                <button onClick={loginToDrive} className="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-full flex items-center gap-2 transition shadow-md font-bold">
                                    <GoogleDriveIcon className="w-4 h-4 bg-white rounded-full p-0.5" /> 
                                    Google 雲端登入
                                </button>
                            ) : (
                                <span className="bg-blue-50 border border-blue-200 text-blue-700 text-xs px-4 py-2 rounded-full flex items-center gap-2 font-bold shadow-sm">
                                    <GoogleDriveIcon className="w-4 h-4" /> 
                                    Drive 已連線
                                </span>
                            )}
                        </div>
                        <h1 className="text-3xl md:text-4xl font-light tracking-[0.2em] uppercase text-black mt-6 md:mt-0">INTOCANAAN DESIGN</h1>
                        <div className="w-12 h-[1px] bg-black mx-auto mt-4 mb-3"></div>
                        <p className="text-xs uppercase tracking-widest text-gray-500">工程進度與日誌系統</p>
                    </header>

                    {/* 控制列 */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-8">
                        <div className="monochrome-border p-4 flex flex-col lg:flex-row justify-between items-center gap-4 bg-gray-50/50">
                            <div className="flex-1 w-full flex items-center gap-4">
                                <div className="w-full lg:w-1/2">
                                    <label className="text-xs text-gray-500 uppercase tracking-widest mb-1 block">專案名稱 * (雲端存檔檔名)</label>
                                    <input type="text" value={projectName} onChange={e=>setProjectName(e.target.value)} className="w-full p-2 border-b border-gray-300 bg-transparent outline-none focus:border-black font-medium text-black" placeholder="請輸入專案名稱"/>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2 justify-end w-full lg:w-auto">
                                {/* 本機檔案 */}
                                <input type="file" accept=".json" ref={fileInputRefJSON} onChange={importLocalJSON} className="hidden" />
                                <button onClick={() => fileInputRefJSON.current.click()} className="px-4 py-2 border border-gray-300 bg-white hover:bg-gray-50 text-xs uppercase tracking-widest flex items-center gap-2 transition">
                                    <UploadIcon className="w-4 h-4"/> 匯入
                                </button>
                                <button onClick={exportLocalJSON} className="px-4 py-2 border border-gray-300 bg-white hover:bg-gray-50 text-xs uppercase tracking-widest flex items-center gap-2 transition">
                                    <DownloadIcon className="w-4 h-4"/> 匯出
                                </button>
                                
                                <div className="w-[1px] h-8 bg-gray-300 hidden lg:block mx-2"></div>

                                {/* Google Drive 雲端專案庫與備份 */}
                                <button onClick={fetchDriveFiles} className="px-4 py-2 border border-blue-200 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs uppercase tracking-widest flex items-center gap-2 transition font-bold shadow-sm">
                                    <GoogleDriveIcon className="w-4 h-4"/> 雲端專案庫
                                </button>
                                <button onClick={saveToGoogleDrive} disabled={isCloudSyncing} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs uppercase tracking-widest flex items-center gap-2 transition disabled:opacity-50 shadow-sm font-bold">
                                    <Cloud className="w-4 h-4"/> {isCloudSyncing ? '備份中...' : 'Drive 雲端備份'}
                                </button>
                                
                                <div className="w-[1px] h-8 bg-gray-300 hidden lg:block mx-2"></div>

                                {/* PDF 匯出 */}
                                <button onClick={() => setReportModalOpen(true)} className="px-4 py-2 bg-black hover:bg-gray-800 text-white text-xs uppercase tracking-widest flex items-center gap-2 transition shadow-sm">
                                    <Printer className="w-4 h-4"/> 業主週報 PDF
                                </button>
                            </div>
                        </div>
                    </div>

                    {toast && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[60] bg-black text-white px-6 py-3 rounded shadow-xl flex items-center gap-2 animate-in fade-in">
                            <CheckCircle className="w-4 h-4" /> <span className="font-light tracking-widest text-sm">{toast}</span>
                        </div>
                    )}

                    {/* 頁籤切換 */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-6 border-y monochrome-border flex gap-8">
                        <button onClick={() => setActiveTab('schedule')} className={`py-3 -mb-[1px] -mt-[1px] text-sm tracking-widest uppercase transition-colors border-y-2 ${activeTab === 'schedule' ? 'border-black font-bold text-black' : 'border-transparent text-gray-400 hover:text-black'}`}>
                            施工進度管理
                        </button>
                        <button onClick={() => setActiveTab('dailyLog')} className={`py-3 -mb-[1px] -mt-[1px] text-sm tracking-widest uppercase transition-colors border-y-2 ${activeTab === 'dailyLog' ? 'border-black font-bold text-black' : 'border-transparent text-gray-400 hover:text-black'}`}>
                            每日施工日誌
                        </button>
                    </div>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col lg:flex-row gap-8">
                        {/* 左側日曆 */}
                        <div className="lg:w-1/3 flex-shrink-0">
                            <div className="sticky top-6 space-y-6">
                                {renderCalendar()}
                                <div className="monochrome-border p-6 bg-gray-50/50">
                                    <h3 className="text-xs uppercase tracking-widest mb-4 flex items-center gap-2">
                                        <TrendingUp className="w-4 h-4" /> 專案整體進度
                                    </h3>
                                    <div className="flex justify-between text-sm text-gray-600 mb-2">
                                        <span>總計 {tasks.length} 項</span>
                                        <span className="font-bold text-black">{overallProgress}%</span>
                                    </div>
                                    <div className="w-full bg-gray-200 h-1">
                                        <div className="bg-black h-full transition-all duration-500" style={{ width: `${overallProgress}%` }}></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 右側內容區 */}
                        <div className="lg:w-2/3">
                            {/* A. 進度管理 */}
                            {activeTab === 'schedule' && (
                                <div className="space-y-6 animate-in fade-in duration-500">
                                    <div className="monochrome-border p-6">
                                        <h3 className="text-xs uppercase tracking-widest mb-4 border-l-2 border-black pl-2">新增排程</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div className="md:col-span-3">
                                                <input type="text" value={newTask.name} onChange={e => setNewTask({...newTask, name: e.target.value})} className="w-full border-b border-gray-300 p-2 outline-none focus:border-black text-sm" placeholder="工項名稱" />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] text-gray-400 uppercase tracking-widest">開始</label>
                                                <input type="date" value={newTask.startDate} onChange={e => setNewTask({...newTask, startDate: e.target.value})} className="w-full border-b border-gray-300 p-2 outline-none focus:border-black text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] text-gray-400 uppercase tracking-widest">結束</label>
                                                <input type="date" value={newTask.endDate} onChange={e => setNewTask({...newTask, endDate: e.target.value})} className="w-full border-b border-gray-300 p-2 outline-none focus:border-black text-sm" />
                                            </div>
                                            <div className="flex items-end">
                                                <button onClick={handleAddTask} className="w-full bg-white border border-black hover:bg-black hover:text-white text-black text-xs uppercase tracking-widest py-2.5 transition">加入排程</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="monochrome-border">
                                        <div className="p-4 bg-gray-50 border-b monochrome-border"><h3 className="text-xs uppercase tracking-widest">排程列表</h3></div>
                                        <div className="divide-y monochrome-border">
                                            {tasks.length === 0 && <p className="p-8 text-center text-sm text-gray-400">尚無資料</p>}
                                            {tasks.map(task => (
                                                <div key={task.id} className="p-4 bg-white flex justify-between items-center gap-4">
                                                    <div className="flex-1">
                                                        <h4 className={`text-sm font-bold ${task.isCompleted ? 'text-gray-400 line-through' : 'text-black'}`}>{task.name}</h4>
                                                        <div className="text-xs text-gray-500 mt-1">{task.startDate} ~ {task.endDate}</div>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <div className="flex flex-col items-end w-32">
                                                            <div className="flex items-center gap-2 w-full mb-1">
                                                                <input type="range" min="0" max="100" value={task.progress} onChange={e => updateTaskProgress(task.id, e.target.value)} disabled={task.isCompleted} className="w-full accent-black"/>
                                                                <span className="text-xs w-8 text-right">{task.progress}%</span>
                                                            </div>
                                                            <button onClick={() => toggleTaskComplete(task.id)} className={`text-[10px] px-2 py-1 uppercase tracking-wider border ${task.isCompleted ? 'bg-white text-gray-400 border-gray-200' : 'bg-black text-white border-black'}`}>{task.isCompleted ? '取消' : '完成'}</button>
                                                        </div>
                                                        <button onClick={() => deleteTask(task.id)} className="text-gray-300 hover:text-red-500"><Trash2 className="w-4 h-4" /></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* B. 施工日誌 */}
                            {activeTab === 'dailyLog' && (
                                <div id="daily-log-print-area" className="monochrome-border bg-white animate-in fade-in duration-500">
                                    <div className="border-b monochrome-border p-6 flex justify-between items-center bg-gray-50">
                                        <div>
                                            <p className="text-xs font-bold text-black tracking-widest uppercase mb-1">{projectName}</p>
                                            <h3 className="text-2xl font-light tracking-widest">{selectedDate}</h3>
                                            <p className="text-xs text-gray-500 tracking-widest uppercase mt-1">施工日誌與備註</p>
                                        </div>
                                        <div>
                                            <select value={logForm.weather} onChange={e => setLogForm({...logForm, weather: e.target.value})} className="bg-white border monochrome-border p-2 text-sm outline-none">
                                                <option value="晴天">☀️ 晴天</option><option value="陰天">☁️ 陰天</option><option value="雨天">🌧️ 雨天</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="p-6 space-y-8">
                                        {/* 人員 */}
                                        <div>
                                            <div className="flex justify-between items-center mb-3">
                                                <h4 className="text-xs uppercase tracking-widest border-l-2 border-black pl-2">進場工種</h4>
                                                <button onClick={() => setLogForm({ ...logForm, workers: [...logForm.workers, { trade: '', count: 1 }] })} className="text-[10px] border border-gray-300 px-2 py-1 uppercase hover:bg-gray-50">+ 新增</button>
                                            </div>
                                            <div className="space-y-2">
                                                {logForm.workers.map((worker, idx) => (
                                                    <div key={idx} className="flex gap-3 items-center">
                                                        <input type="text" placeholder="工種 (例: 泥作)" value={worker.trade} onChange={e => { const w=[...logForm.workers]; w[idx].trade=e.target.value; setLogForm({...logForm, workers:w})}} className="flex-1 border-b border-gray-300 p-2 text-sm outline-none focus:border-black"/>
                                                        <input type="number" min="1" value={worker.count} onChange={e => { const w=[...logForm.workers]; w[idx].count=e.target.value; setLogForm({...logForm, workers:w})}} className="w-16 border-b border-gray-300 p-2 text-sm outline-none text-center"/> 人
                                                        <button onClick={() => setLogForm({ ...logForm, workers: logForm.workers.filter((_, i) => i !== idx) })} className="text-gray-300 hover:text-red-500"><XIcon className="w-4 h-4"/></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 內容 */}
                                        <div>
                                            <h4 className="text-xs uppercase tracking-widest border-l-2 border-black pl-2 mb-3">施工內容</h4>
                                            <textarea rows="4" value={logForm.content} onChange={e => setLogForm({...logForm, content: e.target.value})} className="w-full border monochrome-border p-3 text-sm outline-none focus:border-black custom-scrollbar bg-gray-50/30" placeholder="說明今日施工細節..."></textarea>
                                        </div>

                                        {/* 備註 */}
                                        <div>
                                            <h4 className="text-xs uppercase tracking-widest border-l-2 border-black pl-2 mb-3 flex items-center gap-2"><AlertTriangle className="w-3 h-3"/> 問題與備註</h4>
                                            <textarea rows="2" value={logForm.issues} onChange={e => setLogForm({...logForm, issues: e.target.value})} className="w-full border monochrome-border p-3 text-sm outline-none focus:border-black custom-scrollbar bg-gray-50/30" placeholder="需請示業主或後續追蹤事項..."></textarea>
                                        </div>

                                        {/* 照片 */}
                                        <div>
                                            <div className="flex justify-between items-end mb-3">
                                                <h4 className="text-xs uppercase tracking-widest border-l-2 border-black pl-2">現場照片</h4>
                                                <input type="file" multiple accept="image/*" ref={fileInputRef} onChange={handlePhotoUpload} className="hidden" />
                                                <button onClick={() => fileInputRef.current.click()} className="text-[10px] bg-black text-white px-3 py-1.5 uppercase hover:bg-gray-800 transition flex items-center gap-1"><Camera className="w-3 h-3"/> 上傳</button>
                                            </div>
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                                {logForm.photos.map(photo => (
                                                    <div key={photo.id} className="relative group border monochrome-border aspect-square bg-gray-100 flex items-center justify-center overflow-hidden">
                                                        <img src={photo.url} alt="現場照片" className="object-cover w-full h-full" />
                                                        <button onClick={() => setLogForm({ ...logForm, photos: logForm.photos.filter(p => p.id !== photo.id) })} className="absolute top-1 right-1 bg-white p-1 opacity-0 group-hover:opacity-100 transition shadow border border-gray-200"><Trash2 className="w-3 h-3 text-red-500" /></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="pt-6 border-t monochrome-border flex justify-between">
                                            <button onClick={() => exportPDF('daily-log-print-area', `${projectName}_${selectedDate}日誌.pdf`)} className="px-4 py-2 border border-black text-black text-xs uppercase tracking-widest hover:bg-gray-50 flex gap-2"><Printer className="w-4 h-4"/> 單日匯出</button>
                                            <button onClick={handleSaveLog} className="px-8 py-2 bg-black text-white text-xs uppercase tracking-widest hover:bg-gray-800">暫存日誌</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Google Drive 專案庫 Modal */}
                    {isDriveModalOpen && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-2xl min-h-[40vh] flex flex-col my-8 rounded shadow-2xl">
                                <div className="p-4 border-b monochrome-border flex justify-between items-center bg-blue-50">
                                    <h2 className="text-sm font-bold text-blue-800 tracking-widest uppercase flex items-center gap-2">
                                        <GoogleDriveIcon className="w-5 h-5"/> Google Drive 雲端專案庫
                                    </h2>
                                    <button onClick={() => setIsDriveModalOpen(false)} className="px-3 py-1 border border-blue-300 text-blue-800 text-xs hover:bg-white bg-transparent">關閉</button>
                                </div>
                                <div className="p-6 overflow-y-auto max-h-[60vh]">
                                    {driveFileList.length === 0 ? (
                                        <div className="text-center text-gray-500 py-10 text-sm flex flex-col items-center gap-3">
                                            <Cloud className="w-10 h-10 text-gray-300" />
                                            找不到任何 JSON 雲端備份檔案
                                        </div>
                                    ) : (
                                        <div className="divide-y monochrome-border border monochrome-border">
                                            {driveFileList.map(f => (
                                                <div key={f.id} className="p-4 flex justify-between items-center hover:bg-blue-50/50 transition">
                                                    <div>
                                                        <div className="font-bold text-sm text-black">{f.name}</div>
                                                        <div className="text-xs text-gray-500 mt-1">{new Date(f.modifiedTime).toLocaleString()}</div>
                                                    </div>
                                                    <button onClick={() => loadFromDrive(f.id)} className="px-4 py-2 bg-blue-600 text-white text-xs uppercase hover:bg-blue-700 font-bold shadow-sm rounded flex items-center gap-2">
                                                        <DownloadIcon className="w-3 h-3" /> 載入專案
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 業主週報 PDF 預覽與匯出 Modal */}
                    {reportModalOpen && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-white w-full max-w-4xl min-h-[80vh] flex flex-col my-8">
                                <div className="p-4 border-b monochrome-border flex justify-between items-center sticky top-0 bg-white z-10 shadow-sm">
                                    <h2 className="text-sm font-bold tracking-widest uppercase">業主週報預覽 (過去7天)</h2>
                                    <div className="flex gap-2">
                                        <button onClick={() => setReportModalOpen(false)} className="px-3 py-1 border border-gray-300 text-xs">關閉</button>
                                        <button onClick={() => exportPDF('weekly-report-content', `${projectName}_週報.pdf`)} className="px-3 py-1 bg-black text-white text-xs flex items-center gap-1"><Printer className="w-3 h-3"/> 下載 PDF</button>
                                    </div>
                                </div>
                                <div className="p-8 overflow-y-auto" id="weekly-report-content">
                                    <div className="text-center mb-10">
                                        <h1 className="text-2xl font-light tracking-[0.2em] uppercase mb-2">INTOCANAAN DESIGN</h1>
                                        <div className="w-8 h-[1px] bg-black mx-auto mb-4"></div>
                                        <h2 className="text-lg font-bold">{projectName}</h2>
                                        <p className="text-xs text-gray-500 mt-1">工程進度與每週施工報告</p>
                                        <p className="text-xs mt-2 text-gray-600">區間: {generateWeeklyReportData().startStr} ~ {generateWeeklyReportData().endStr}</p>
                                    </div>

                                    <div className="mb-10">
                                        <h3 className="text-sm font-bold border-b border-black pb-2 mb-4 uppercase tracking-widest">A. 專案總體進度 ({overallProgress}%)</h3>
                                        <div className="space-y-2 text-sm">
                                            {generateWeeklyReportData().activeTasks.map(t => (
                                                <div key={t.id} className="flex justify-between border-b monochrome-border pb-1">
                                                    <span>{t.name}</span>
                                                    <span className="text-gray-500">{t.progress}% ({t.startDate} ~ {t.endDate})</span>
                                                </div>
                                            ))}
                                            {generateWeeklyReportData().activeTasks.length === 0 && <p className="text-gray-400 text-xs">本週無進行中之排定工項。</p>}
                                        </div>
                                    </div>

                                    <div>
                                        <h3 className="text-sm font-bold border-b border-black pb-2 mb-4 uppercase tracking-widest">B. 每日施工紀錄</h3>
                                        {generateWeeklyReportData().weeklyLogs.length === 0 && <p className="text-gray-400 text-xs">本週無施工日誌。</p>}
                                        {generateWeeklyReportData().weeklyLogs.map(log => (
                                            <div key={log.id} className="mb-8 page-break-inside-avoid">
                                                <div className="bg-gray-50 p-2 mb-2 flex justify-between items-center border monochrome-border">
                                                    <span className="font-bold">{log.date}</span>
                                                    <span className="text-xs text-gray-500">天氣: {log.weather}</span>
                                                </div>
                                                <div className="text-xs text-gray-700 mb-2">
                                                    <strong>進場人員:</strong> {log.workers.map(w => `${w.trade}(${w.count}人)`).join('、 ') || '無'}
                                                </div>
                                                <div className="text-sm mb-2 whitespace-pre-wrap">{log.content}</div>
                                                {log.issues && (
                                                    <div className="text-xs text-red-600 mb-3 bg-red-50 p-2 border border-red-100">
                                                        <strong>備註/問題:</strong> {log.issues}
                                                    </div>
                                                )}
                                                <div className="grid grid-cols-3 gap-2">
                                                    {log.photos.slice(0,3).map((p, i) => (
                                                        <img key={i} src={p.url} className="w-full h-32 object-cover border monochrome-border"/>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
